# ============================================================================
#  EXAMPLE PROFILE - a very different migration on the same pack.
#  COBOL/CICS mainframe -> Java 21 / Spring Boot, single web surface,
#  English deliverables, batch-heavy. Demonstrates the pack is not
#  tied to VB.NET, to Japanese, or to a screen-centric system.
# ============================================================================
schema_version: "1.0"

project:
  key: CLM
  name: "Claims Processing Modernisation"
  vendor: "<Vendor>"
  client: "<Insurer>"
  copyright: "(c) 2026 <Insurer>. All rights reserved."
  start_date: "2026-03-02"

legacy:
  kind: cobol
  root: "legacy"
  ui_source: "legacy/bms"              # CICS BMS map definitions = the "screens"
  logic_source: "legacy/cbl"           # COBOL programs
  db_source: "legacy/ddl"              # DB2 DDL + copybooks
  readonly: true
  screen_capture_dir: "docs/green-screens"
  excluded:
    - id: "LEG-RPT-031"
      reason: "Nightly microfiche report - decommissioned 2019, confirmed by ops"

target:
  root: "app"
  architecture: "Hexagonal, module-per-bounded-context"
  stack:
    backend: "Java 21, Spring Boot 3"
    frontend: "Angular 18"
    database: "PostgreSQL (schema converted from DB2, frozen after conversion)"
    data_access: "Spring Data JDBC + explicit SQL"
    auth: "OIDC via Keycloak"
    package_manager: "Gradle + npm"
  surfaces:
    - id: WEB
      label: "Web application"
      id_suffix: "W"
      viewport: "1280x800+"
    - id: BATCH
      label: "Scheduled batch job"
      id_suffix: "B"
      viewport: "-"
  environments:
    - {id: local,   purpose: "development", data: "synthetic"}
    - {id: test,    purpose: "UT / IT",     data: "masked extract"}
    - {id: parallel, purpose: "parallel run - mainframe and Java on the same daily input",
       data: "full production copy", production_like: true}
    - {id: uat,     purpose: "UAT",  data: "client-prepared"}
    - {id: prod,    purpose: "live", data: "live"}
    - {id: legacy-prod, purpose: "the z/OS region in production", data: "live", readonly: true}
  build:
    order:
      - "./gradlew :domain:build"
      - "./gradlew :app:build"
      - "npm --prefix web run build"
    typecheck: "npm --prefix web run typecheck"
    test_unit: "./gradlew test"
    test_e2e: "npm --prefix web run e2e"

# The batch chain is the project. Parallel run compares output files byte for byte,
# which is the strongest parity evidence available anywhere in this pack.
infrastructure:
  scm:
    platform: github
    host: cloud
    remote_url: "https://github.com/example/ledger-migration"
    default_branch: main
    branching_model: trunk-based
    review_unit: "pull request"
    protected_branches: ["main"]
  ci:
    platform: github-actions
    definition_path: ".github/workflows/ci.yml"
    runs_on: "hosted runner"
    stages: [build, typecheck, lint, test_unit, test_integration, package]
    enforces_gates: [P4_implementation, P5_unit_test]
    artifact_retention_days: 90
  cd:
    strategy: pipeline-triggered
    approval_required_for: [uat, prod]
    deployment_pattern: blue-green
  hosting:
    provider: aws
    runtime: container
    regions: ["eu-west-1"]
  containers:
    enabled: true
    runtime: docker
    registry: "ghcr.io/example"
    compose_for_local: true
  iac:
    tool: terraform
    root: "infra"
    state_backend: "S3 + DynamoDB lock"
    manual_changes_allowed: false
  secrets:
    store: "AWS Secrets Manager; GitHub environment secrets for CI"
    rotation_policy: "90 days"
  observability:
    logs: "CloudWatch Logs"
    metrics: "CloudWatch Metrics + Grafana"
    traces: "OpenTelemetry -> Tempo"
    alerting: "PagerDuty -> platform on-call"
  coexistence:
    strategy: parallel
    duration: "one full month-end cycle, then big-bang switch"
    system_of_record: legacy
    dual_write: false
    conflict_resolution: ""
    router: "none - the mainframe remains authoritative until the switch"
    user_routing: "n/a: batch only, no interactive users during the parallel period"
  data_migration:
    tool: "extract to flat files, load with Java batch"
    root: "migration-scripts"
    reconciliation_required: true
    reconciliation: ["record counts per file", "control totals on every amount field",
                     "record counts by transaction type", "EBCDIC->UTF-8 spot checks",
                     "COMP-3 precision spot checks"]
    rehearsals_required: 3
    cutover_window: "one weekend between month-end cycles"
    point_of_no_return: "the first posting run executed on the Java side"
  parallel_run:
    enabled: true
    environment: parallel
    compare: ["batch output files", "report output", "database state"]
    tolerance: "exact"
    duration: "one full month-end cycle"
    sign_off_by: "Finance Systems Manager"
  rollback:
    target: legacy
    data_strategy: "the mainframe kept current throughout the parallel period; no target-only records exist before the switch"
    rehearsed: false
    decision_owner: "Finance Systems Manager, by the Monday of the switch weekend"
  owner: "this project"
  repo_may_write_infra: true
  legacy_infrastructure: "z/OS LPAR, JES2 job scheduling, VSAM and DB2 - client-operated, read-only"

ids:
  module_pattern: "^CLM[0-9]{3}(W|B)$"
  module_example: "CLM101W"
  doc_id_format: "{MODULE}-{TYPE}-{NNN}"
  types:
    screen: SC
    function: FC
    api: API
    batch: BT
    report: RP
    file: FL
    detail: DD
  message_id_format: "MSG-{MODULE_BASE}-{NNN}"
  requirement_id_format: "REQ-{AREA}-{NNN}"
  legacy_id_format: "LEG-{AREA}-{NNN}"
  test_id_format:
    unit: "UT-{MODULE}-{NNN}"
    integration: "IT-{MODULE}-{NNN}"
    uat: "UAT-{NNN}"
  number_width: 3

paths:
  docs_root: "docs"
  requirements: "docs/02.requirements"
  design_root: "docs/03.design"
  detail_design: "docs/04.detail-design"
  test_design: "docs/05.test-design"
  reviews: "docs/07.reviews"
  gap_reports: "docs/06.gap"
  uat_reports: "docs/uat"
  change_requests: "docs/change-requests"
  bug_traces: "docs/bug-trace"
  traceability: "docs/traceability.csv"
  bd_categories:
    - key: architecture
      dir: "01.architecture"
      skill: mig-basic-design
    - key: screen
      dir: "02.screen-design"
      skill: mig-screen-design
    - key: function
      dir: "03.function-design"
      skill: mig-function-design
    - key: batch
      dir: "04.batch-design"
      skill: mig-batch-design
    - key: data
      dir: "05.data-design"
      skill: mig-data-design
    - key: interface
      dir: "06.interface-design"
      skill: mig-api-design
    - key: report
      dir: "07.report-design"
      skill: mig-basic-design

language:
  primary: en
  working: en
  by_path:
    - path: "docs/**"
      lang: en
  immutable_tokens:
    - "module IDs"
    - "document IDs"
    - "MSG-IDs"
    - "copybook and field names"
    - "program names"
    - "table and column names"
    - "code blocks"
  dictionary: ""
  grammar_fixes: ""

document:
  revision_table_headers: ["Version", "Date", "Change", "Author", "Approver", "Approved on"]
  initial_version: "1.0.0"
  initial_change_text: "Initial version"
  auto_version_bump: false
  date_format: "YYYY-MM-DD"
  diagram_tool: mermaid
  diagram_constraints:
    - "flowchart TD only for processing flows"

templates:
  root: "docs/templates"
  on_missing: ask
  formats_enabled: [md, csv]
  registry:
    - {key: data, path: "docs/templates/record-layout.md", format: md,
       output_format: md, sheet: "", header_rows: 0, fields: [], status: provided}
  template_wins_over_skill: true
  preserve_unfilled_structure: true
  # Printed COBOL program specifications from the 1990s, scanned to PDF. Useful for
  # rationale, wrong about behaviour more often than not (DIO-08).
  legacy_documents_dir: "docs/00.legacy-documents"

mockup:
  enabled: true
  kind: html
  dir: "docs/03.design/09.mockup"
  surfaces: [WEB]
  naming: "{MODULE}_{screen name}"
  # A 24x80 terminal layout is a constraint that no longer exists. Field set, field
  # order and flow are preserved; the grid is not. Anything beyond that is per-screen.
  fidelity: restyled
  fidelity_exceptions: []
  html:
    self_contained: true
    shared_assets: "_assets"
    viewport_per_surface: true
  figma:
    file_url: ""
    access: ""
    export_dir: ""
    writable: false
  canvas:
    artifact_url: ""
  states_required: [normal, empty, loading, error, no-permission]
  cross_check_with_screen_design: true
  cross_check_with_legacy: true

gates:
  P0_legacy_analysis:
    - "every BMS map and every COBOL program has a LEG-* id"
    - "every copybook is linked to the programs that use it"
  P1_requirements:
    - "every REQ-* cites at least one LEG-*"
  P2_basic_design:
    - "every BMS field appears in the corresponding screen design"
    - "every batch job documents its restart / rerun behaviour"
  P3_detail_design:
    - "GAP report has zero unresolved items"
  P4_implementation:
    - "build passes in the mandated order"
  P5_unit_test:
    - "every FC has at least one UT case"
    - "COBOL numeric edge cases (COMP-3, signed overpunch) are covered"
  P6_integration_test:
    - "every batch job has an end-to-end scenario with a restart case"
  P7_uat:
    - "parallel-run output matches legacy output for the agreed sample period"

review:
  families:
    common: true
    screen: true
    function: true
    api: true
    data: true
    batch: true
    report: true
  severity_levels: ["Critical", "Warning", "Suggestion"]
  output_dir: "{{profile.paths.reviews}}"

constraints:
  db_schema_frozen: false        # schema IS converted in this project
  stored_procedures_readonly: false
  generated_files_glob: "**/generated/**"
  secrets_policy: "secrets in Vault; .env.example documents the required keys"
  readonly_globs:
    - "legacy/**"
    - "**/generated/**"

# ---------------------------------------------------------------------------
# EXECUTION - which model the delegated agents run on.
# Applied to .claude/agents/*.md frontmatter by /mig-init.
# ---------------------------------------------------------------------------
execution:
  # Model and effort profile for the mig-* agents. Each agent is in one tier:
  #   heavy    - analysis, design, review, triage: silent failure modes that
  #              only surface at review, UAT or the steering committee.
  #   standard - production work from an approved document (code, tests,
  #              infra, mockups, reports), checked by build, tests and review.
  # quality  : heavy opus xhigh,   standard opus high
  # balanced : heavy opus high,    standard sonnet medium   (pack default)
  # budget   : heavy sonnet high,  standard sonnet medium
  # The tier of every agent is listed in PROFILE-SCHEMA.md, "execution".
  model_profile: quality
  agent_model_overrides: {}        # per-agent, wins over the profile
  agent_effort_overrides: {}       # per-agent effort: low | medium | high | xhigh | max
  # Effort for your own session, where the commands run. Agents take theirs
  # from model_profile; the session level is set with /effort, not from here.
  intended_effort: "xhigh"

# ---------------------------------------------------------------------------
# TESTING - batch-heavy project: parallel run matters more than UI automation.
# ---------------------------------------------------------------------------
testing:
  paths:
    testcase_root: "test/cases"
    step_subdir: "Step"
    it_plan: "test/it-plan"
    automation_root: "test/automation"
    evidence_root: "test/evidence"
    results_root: "test/results"
  naming:
    module_dir: "UT_{BATCH}_{MODULE}"
    ut_file: "UT_{BATCH}_{MODULE}_{TS}.md"
    it_file: "IT_{FLOW}_{TS}.md"
    timestamp: "YYYYMMDD_HHmmss"
    batches: ["Wave1", "Wave2"]
  pipeline:
    human_pauses: ["after_qna", "after_checklist"]
    keep_retry_history: true
    max_review_rounds: 3
  # VP-05 dropped: batch jobs have no interactive submission to repeat.
  viewpoints: [VP-01, VP-02, VP-03, VP-04, VP-06, VP-07, VP-08, VP-09]
  integration:
    flow_catalogue: "test/it-plan/flow-definition.csv"
    strategy_guide: "test/it-plan/strategy-guide.csv"
    e2e_swimlane: "test/it-plan/e2e-swimlane.csv"
    api_payload_in_scope: false
  automation:
    framework: "Playwright + TypeScript (UI), JUnit (batch)"
    layout:
      specs: "e2e/tests/{module}"
      page_objects: "e2e/src/pages"
      data: "e2e/src/data"
      fixtures: "e2e/src/fixtures"
      db_client: "e2e/src/db"
    spec_naming: "{module}.flow{N}.spec.ts"
    db_driven_search: true
    results_format: "allure"
  evidence:
    naming: "{TC_ID}_{seq}"
    formats: ["png", "csv", "txt"]
  rounds:
    count: 2
    columns: ["date", "tester", "result", "note"]

change_request:
  id_format: "CR-{YYYY}-{NNN}"
  id_source: client
  min_options: 2
  gates: ["after_options", "after_design"]
  cascade:
    - data
    - screen
    - function
    - interface
    - detail
    - report
    - batch
    - indexes
    - test_cases
  update_test_cases: true
  classes: [CR-UI, CR-FIELD, CR-LOGIC, CR-MESSAGE, CR-REPORT, CR-DATA,
            CR-NEW, CR-REMOVE, CR-CLARIFY, CR-OUT-OF-SCOPE]
