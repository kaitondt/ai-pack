# ============================================================================
#  EXAMPLE PROFILE - the original CNS WMS migration, expressed as profile data.
#  Nothing below appears in any skill file. This is the whole delta between
#  "the standard pack" and "the WMS pack".
# ============================================================================
schema_version: "1.0"

project:
  key: WMS
  name: "Warehouse Management System"
  vendor: "NTQ"
  client: "CNS"
  copyright: "(c) 2026 CNS Co., Ltd All rights reserved."
  start_date: "2026-01-06"

legacy:
  kind: vbnet
  root: "src/legacy"
  ui_source: "src/legacy/Fukudaryu_SokoManageSystem/PcGamen"
  logic_source: "src/legacy/Fukudaryu_SokoManageSystem"
  db_source: "src/legacy/procedure"
  readonly: true
  screen_capture_dir: "src/wms/docs/legacy-captures"
  excluded:
    - id: "LEG-MENU-014"
      reason: "Button disabled in every state of SetMenuBtnEnable - blocked feature, client confirmed out of scope"

target:
  root: "src/wms"
  architecture: "Clean Architecture (Jason Taylor pattern) + CQRS via MediatR"
  stack:
    backend: ".NET 9, ASP.NET Core Web API"
    frontend: "React 19 + Vite + TypeScript + Zustand + Shadcn/ui + Tailwind CSS"
    database: "SQL Server (existing schema, no migrations)"
    data_access: "Dapper, all access through stored procedures"
    auth: "JWT Bearer"
    package_manager: "pnpm workspaces (monorepo)"
  surfaces:
    - id: PC
      label: "Desktop browser"
      id_suffix: "PG"
      viewport: "1280x800+"
    - id: HH
      label: "Keyence BT-A1000 handheld terminal"
      id_suffix: "HG"
      viewport: "320x534"
    - id: BT
      label: "Batch job (no UI)"
      id_suffix: "BT"
      viewport: "-"
  # The client's own environment names. `parallel` is where the VB.NET client and
  # the new web app process the same receiving data and the outputs are compared.
  environments:
    - {id: local,   purpose: "development", data: "synthetic"}
    - {id: test,    purpose: "UT / IT",     data: "masked copy of production"}
    - {id: parallel, purpose: "parallel run - old client and new web app on the same input",
       data: "live copy, refreshed nightly", production_like: true}
    - {id: uat,     purpose: "UAT",  data: "client-prepared"}
    - {id: prod,    purpose: "live", data: "live"}
    - {id: legacy-prod, purpose: "the VB.NET client in production", data: "live", readonly: true}
  build:
    order:
      - "pnpm --filter @wms/shared build"
      - "pnpm --filter @wms/ui build"
      - "pnpm --filter @wms/desktop build"
      - "pnpm --filter @wms/handy build"
      - "dotnet build src/backend/WMS.sln"
    typecheck: "pnpm -r typecheck"
    test_unit: "dotnet test src/backend/WMS.sln"
    test_e2e: "pnpm --filter @wms/desktop test:e2e"

# Client IS owns every environment; this project proposes and hands over a package.
# Phased cutover by warehouse site, so both systems are live for months.
infrastructure:
  scm:
    platform: azure-repos
    host: cloud
    remote_url: "https://dev.azure.com/kariya/WMS/_git/WMS"
    default_branch: main
    branching_model: release-branch
    review_unit: "pull request"
    protected_branches: ["main", "release/*"]
  ci:
    platform: azure-pipelines
    definition_path: "azure-pipelines.yml"
    runs_on: "self-hosted"
    stages: [build, typecheck, lint, test_unit, test_integration, package]
    enforces_gates: [P4_implementation]
    artifact_retention_days: 365
  cd:
    strategy: manual
    approval_required_for: [uat, prod]
    deployment_pattern: recreate
  hosting:
    provider: on-prem
    runtime: vm
    regions: ["client data centre, Nagoya"]
  containers:
    enabled: false
    runtime: none
    registry: ""
    compose_for_local: true
  iac:
    tool: none
    root: "infra"
    state_backend: "n/a"
    manual_changes_allowed: true
  secrets:
    store: "client-managed credential store; .env.example documents the keys"
    rotation_policy: "client policy, 180 days"
  observability:
    logs: "client syslog aggregation"
    metrics: "Zabbix (client-operated)"
    traces: "none"
    alerting: "client IS operations desk"
  coexistence:
    strategy: phased
    duration: "approximately 4 months, one warehouse site at a time"
    system_of_record: legacy
    dual_write: false
    conflict_resolution: ""
    router: "none - a site uses one system or the other, never both"
    user_routing: "per site: staff at a migrated site use the web app only"
  data_migration:
    tool: "SQL scripts"
    root: "migration-scripts"
    reconciliation_required: true
    reconciliation: ["row counts per table", "control totals on quantity and amount columns",
                     "referential integrity", "spot-check of 20 client-chosen receiving slips"]
    rehearsals_required: 2
    cutover_window: "8 hours overnight, per site; no receiving during the window"
    point_of_no_return: "the first receiving slip registered in the web app at that site"
  parallel_run:
    enabled: true
    environment: parallel
    compare: ["screen output", "report output", "database state"]
    tolerance: "exact"
    duration: "2 weeks per site before cutover"
    sign_off_by: "Client IS Department Head"
  rollback:
    target: legacy
    data_strategy: "slips registered in the web app are re-keyed into the old client from a printed report"
    rehearsed: false
    decision_owner: "Client IS Department Head, by 06:00 on the cutover morning"
  owner: "client ops"
  repo_may_write_infra: false
  legacy_infrastructure: "VB.NET client deployed by file share to site PCs; SQL Server on-prem"

ids:
  module_pattern: "^KK[0-9]{4}(PG|HG|BT)$"
  module_example: "KK0030PG"
  doc_id_format: "{MODULE}-{TYPE}-{NNN}"
  types:
    screen: SC
    function: FC
    api: API
    batch: BT
    report: RP
    file: FL
    detail: DD
  message_id_format: "MSG-{MODULE_BASE}-{NNN}"
  requirement_id_format: "REQ-{AREA}-{NNN}"
  legacy_id_format: "LEG-{AREA}-{NNN}"
  test_id_format:
    unit: "UT-{MODULE}-{NNN}"
    integration: "IT-{MODULE}-{NNN}"
    uat: "UAT-{NNN}"
  number_width: 3

paths:
  docs_root: "src/wms/docs"
  requirements: "src/wms/docs"
  design_root: "src/wms/docs/deliverables_jp"
  detail_design: "src/wms/docs/deliverables_jp/10.詳細設計"
  test_design: "src/wms/docs/deliverables_jp/09.テスト設計"
  reviews: "src/wms/docs/checklists"
  gap_reports: "src/wms/docs/gap"
  uat_reports: "uat-bug"
  change_requests: "change-request"
  bug_traces: "bug-trace"
  traceability: "src/wms/docs/traceability.csv"
  bd_categories:
    - key: architecture
      dir: "01.方式設計"
      skill: mig-basic-design
    - key: screen
      dir: "02.画面設計"
      skill: mig-screen-design
    - key: function
      dir: "03.機能設計/オンライン"
      skill: mig-function-design
    - key: batch
      dir: "03.機能設計/バッチ"
      skill: mig-batch-design
    - key: data
      dir: "04.DB設計"
      skill: mig-data-design
    - key: interface
      dir: "05.インタフェース設計"
      skill: mig-api-design
    - key: report
      dir: "06.帳票設計"
      skill: mig-basic-design
    - key: file
      dir: "07.ファイル設計"
      skill: mig-basic-design

language:
  primary: ja
  working: vi
  by_path:
    - path: "src/wms/docs/deliverables_jp/**"
      lang: ja
    - path: "src/wms/docs/deliverables/**"
      lang: vi
    - path: "uat-bug/**"
      lang: vi
    - path: "change-request/**"
      lang: vi
    - path: "bug-trace/**"
      lang: vi
  immutable_tokens:
    - "screen IDs"
    - "function IDs"
    - "API IDs"
    - "MSG-IDs"
    - "table names"
    - "stored-procedure names"
    - "field names"
    - "path strings"
    - "code blocks"
  dictionary: "src/wms/docs/dictionary.csv"
  grammar_fixes: "src/wms/docs/fix_grammar.csv"

document:
  revision_table_headers: ["版数", "年月日", "改訂内容", "改訂者", "承認者", "承認年月日"]
  initial_version: "1.0.0"
  initial_change_text: "新規作成"
  auto_version_bump: false
  date_format: "YYYY/MM/DD"
  diagram_tool: mermaid
  diagram_constraints:
    - "flowchart TD only"
    - "mermaid v8.9.2 compatible - no cylinder shape, added in v9.2"
  footer: "{{profile.project.copyright}}"

# The client supplies every form, in Excel, and the forms are contractual.
templates:
  root: "src/wms/docs/templates"
  on_missing: ask
  formats_enabled: [md, xlsx, docx, csv]
  registry:
    - {key: screen,   path: "src/wms/docs/templates/画面設計書_様式.xlsx",
       format: xlsx, output_format: xlsx, sheet: "画面設計", header_rows: 8,
       fields: [], status: provided}
    - {key: function, path: "src/wms/docs/templates/機能設計書_様式.xlsx",
       format: xlsx, output_format: xlsx, sheet: "機能設計", header_rows: 8,
       fields: [], status: provided}
    - {key: data,     path: "src/wms/docs/templates/テーブル定義書_様式.xlsx",
       format: xlsx, output_format: xlsx, sheet: "テーブル定義", header_rows: 6,
       fields: [], status: provided}
  template_wins_over_skill: true
  preserve_unfilled_structure: true
  # The old system's design documents, from the 2011 build. Inputs only: several
  # describe screens that were removed years ago (DIO-08).
  legacy_documents_dir: "src/wms/docs/legacy-documents"

mockup:
  enabled: true
  kind: html
  dir: "src/wms/docs/deliverables_jp/09.モックアップ"
  surfaces: [PC, HH]
  naming: "{MODULE}_{screen name}"
  # Warehouse staff have used the VB.NET client for a decade and are measured on
  # throughput. Nothing moves without a decision.
  fidelity: as-is
  fidelity_exceptions: []
  html:
    self_contained: true
    shared_assets: "_assets"
    viewport_per_surface: true
  figma:
    file_url: ""
    access: ""
    export_dir: ""
    writable: false
  canvas:
    artifact_url: ""
  states_required: [normal, empty, loading, error, no-permission]
  cross_check_with_screen_design: true
  cross_check_with_legacy: true

gates:
  P0_legacy_analysis:
    - "every PcGamen / HandyGamen form has a LEG-* id"
  P1_requirements:
    - "every REQ-* cites at least one LEG-*"
  P2_basic_design:
    - "SC grid columns match the legacy Designer grid columns"
    - "FC input params match API request params"
    - "SC MSG-IDs match FC MSG-IDs"
  P3_detail_design:
    - "GAP report per screen has zero unresolved items"
  P4_implementation:
    - "local build passes in the mandated order"
  P5_unit_test:
    - "every FC has at least 4 UT cases across the 9 viewpoints"
  P6_integration_test:
    - "every screen has a Layout Integrity scenario group"
  P7_uat:
    - "every UAT bug report carries a client-issued bug ID"
  CR_change_request:
    - "every CR report carries a client-issued CR ID from the client's CR list"
    - "the ja and vi deliverable branches carry the same business change"

review:
  families:
    common: true
    screen: true
    function: true
    api: true
    data: true
    batch: true
    report: true
  severity_levels: ["Critical", "Warning", "Suggestion"]
  output_dir: "{{profile.paths.reviews}}"

constraints:
  db_schema_frozen: true
  stored_procedures_readonly: true
  generated_files_glob: "**/*.generated.ts"
  secrets_policy: "never commit secrets; .env.example documents the required keys"
  readonly_globs:
    - "src/legacy/**"
    - "**/*.generated.ts"

# ---------------------------------------------------------------------------
# EXECUTION - which model the delegated agents run on.
# Applied to .claude/agents/*.md frontmatter by /mig-init.
# ---------------------------------------------------------------------------
execution:
  # Default for every mig-* agent. These roles all produce content whose failure
  # modes are silent - invented behaviour, missed anchors, a dropped category -
  # and none of them surface until client review. Cheap models fail there first.
  agent_model: opus
  # Per-agent overrides, only where a role is genuinely mechanical.
  agent_model_overrides: {}
  # Reasoning effort is a session-level setting in Claude Code, not agent
  # frontmatter. Record the intended level here so the team runs consistently.
  intended_effort: "extra high"

# ---------------------------------------------------------------------------
# TESTING - the real values from the WMS test pack.
# ---------------------------------------------------------------------------
testing:
  paths:
    testcase_root: "cns_wms_test/Testcase"
    step_subdir: "Step"
    it_plan: "cns_wms_test/IT_Plan"
    automation_root: "cns_wms_test/automation"
    evidence_root: "cns_wms_test/Evidence"
    results_root: "allure-results"
  naming:
    module_dir: "UT_{BATCH}_{MODULE}"
    ut_file: "UT_{BATCH}_{MODULE}_{TS}.md"
    it_file: "IT_{FLOW}_{TS}.md"
    timestamp: "YYYYMMDD_HHmmss"
    batches: ["Pilot", "Batch1", "Batch2", "Batch3"]
  pipeline:
    human_pauses: ["after_qna", "after_checklist"]
    keep_retry_history: true
    max_review_rounds: 3
  viewpoints: [VP-01, VP-02, VP-03, VP-04, VP-05, VP-06, VP-07, VP-08, VP-09]
  integration:
    flow_catalogue: "cns_wms_test/IT_Plan/03.Flow_Definition.csv"
    strategy_guide: "cns_wms_test/IT_Plan/02.Strategy_Guide.csv"
    e2e_swimlane: "cns_wms_test/IT_Plan/04.E2E_Swimlane.csv"
    api_payload_in_scope: false
  automation:
    framework: "Playwright + TypeScript"
    layout:
      specs: "tests/{module}"
      page_objects: "src/pages"
      data: "src/data"
      fixtures: "src/fixtures"
      db_client: "src/db"
    spec_naming: "{module}.flow{N}.spec.ts"
    db_driven_search: true
    results_format: "allure"
  evidence:
    naming: "{TC_ID}_{seq}"
    formats: ["png", "jpg", "csv"]
  rounds:
    count: 2
    columns: ["テスト実施日", "担当者", "結果", "備考"]

change_request:
  id_format: "CR-{NNN}"
  id_source: client
  min_options: 2
  gates: ["after_options", "after_design"]
  cascade:
    - data               # 04.DB設計
    - screen             # 02.画面設計
    - function           # 03.機能設計/オンライン
    - interface          # 05.インタフェース設計
    - detail             # 10.詳細設計
    - mockup             # 08.モックアップ
    - report             # 06.帳票設計
    - file               # 07.ファイル設計
    - batch              # 03.機能設計/バッチ
    - indexes            # 画面一覧 / 機能一覧 / API一覧 / テーブル一覧 / 帳票一覧
    - translations       # deliverables/ (vi) mirror of deliverables_jp/ (ja)
    - test_cases         # deliverables/09.テスト設計 - vi branch only
  update_test_cases: true
  classes: [CR-UI, CR-FIELD, CR-LOGIC, CR-MESSAGE, CR-REPORT, CR-DATA,
            CR-NEW, CR-REMOVE, CR-CLARIFY, CR-OUT-OF-SCOPE]
