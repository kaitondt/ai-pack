# Example: a three-person startup with paying pilot customers.
# FastAPI + React, Postgres on a managed host, public URL, real personal data.
# Stage mvp, preparing for production; pm-standard planned for investor reporting.
schema_version: "1.0"

project:
  key: PRJF
  name: "ExampleApp"
  one_liner: "Lets hourly staff at small restaurants swap shifts without texting the manager."
  owner: "Founder (CEO)"
  start_date: "2026-05-04"

stage: mvp

team:
  shape: small
  reviewers: ["Huy (backend)", "Trang (frontend)"]

product:
  users: ["restaurant staff (mobile web)", "restaurant manager (desktop)"]
  core_flows:
    - "manager publishes the weekly schedule"
    - "staff offers a shift; another staff member claims it"
    - "manager approves or rejects a swap"
    - "everyone involved is notified by SMS"
    - "sign in with phone number + one-time code"
  public_url: true

stack:
  language: "Python 3.12 (backend), TypeScript 5 (frontend)"
  framework: "FastAPI + React 19 (Vite)"
  ui: "Tailwind CSS"
  database: "PostgreSQL 16 (Neon)"
  orm: "SQLAlchemy 2 + Alembic"
  auth: "Supabase Auth (phone OTP)"
  hosting: "Fly.io (API), Cloudflare Pages (web)"
  package_manager: "uv (backend), pnpm (frontend)"

commands:
  install: "uv sync && pnpm -C web install"
  dev: "docker compose up"
  dev_url: "http://localhost:5173"
  build: "pnpm -C web build"
  typecheck: "uv run mypy app && pnpm -C web tsc --noEmit"
  lint: "uv run ruff check app && pnpm -C web lint"
  format: "uv run ruff format app && pnpm -C web prettier --write ."
  test: "uv run pytest -q"
  test_e2e: "pnpm -C web playwright test"
  audit: "uv run pip-audit && pnpm -C web audit --audit-level=high"
  smoke: "curl -fsS https://api.exampleapp.example/health"

paths:
  vibe_root: "vibe"
  product: "vibe/PRODUCT.md"
  state: "vibe/STATE.md"
  intents: "vibe/intents"
  decisions: "vibe/decisions.md"
  debt: "vibe/debt.md"
  bugs: "vibe/bugs.md"
  backlog: "vibe/backlog.md"
  reviews: "vibe/reviews"
  releases: "vibe/releases"
  skill_changes: "vibe/skill-changes.md"

slices:
  max_files: 6            # tighter than default: three people reviewing each other's slices
  max_changed_lines: 300
  max_minutes: 60
  require_clean_tree: true
  exclude_from_budget:
    - "vibe/**"
    - "uv.lock"
    - "web/pnpm-lock.yaml"
    - "alembic/versions/**"
    - "**/__snapshots__/**"

loop:
  max_fix_attempts: 3
  attempt_branch_prefix: "attempt/"

verification:
  add:
    prototype: []
    mvp:
      - "Alembic migration applies and downgrades cleanly on a copy of the schema"
      - "SMS provider called through the sandbox in tests - never live"
    production:
      - "load test: 200 concurrent claims on one shift, exactly one succeeds"
  ui_check: "playwright"

security:
  secret_store: "Fly secrets (API), Cloudflare env vars (web); .env locally"
  env_files: [".env", ".env.local"]
  allowed_licenses: ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "PSF-2.0", "0BSD"]
  allow_real_data: true   # production only; staging uses generated restaurants
  dangerous_commands:
    - "fly\\s+deploy"
    - "fly\\s+secrets\\s+(?:set|unset)"
    - "wrangler\\s+pages\\s+deploy"
    - "alembic\\s+(?:upgrade|downgrade).*--sql-url.*prod"
    - "neonctl\\s+branches\\s+delete"
  protected_paths:
    - "web/src/api/generated/**"   # OpenAPI client - regenerate, never hand-edit

debt:
  paydown_every_n_slices: 4
  block_graduation_on_due: true

release:
  environments: ["local", "staging", "production"]
  deploy: "merge to main -> CI builds -> human runs `fly deploy --app exampleapp-api` and `wrangler pages deploy web/dist`"
  rollback: "fly releases rollback --app exampleapp-api; Cloudflare Pages: roll back to previous deployment"
  monitoring: "Sentry (API + web), Better Stack uptime on /health, alerts to #ops Slack"
  backups: "Neon point-in-time restore (7 days); restore tried 2026-08-20"

graduation:
  extra_criteria:
    prototype: []
    mvp: []
    production:
      - "privacy policy and data-deletion flow live (staff phone numbers)"
      - "SMS spend alert below the monthly budget"
  handoff_to: "pm"        # investor reporting and pilot contracts; engineering stays vibe

integration:
  sibling_packs: auto

execution:
  # Model and effort profile for the vibe-* agents. Each agent is in one tier:
  #   heavy    - analysis, design, review, triage: silent failure modes that
  #              only surface at review, UAT or the steering committee.
  #   standard - production work from an approved document (code, tests,
  #              infra, mockups, reports), checked by build, tests and review.
  # quality  : heavy opus xhigh,   standard opus high
  # balanced : heavy opus high,    standard sonnet medium   (pack default)
  # budget   : heavy sonnet high,  standard sonnet medium
  # The tier of every agent is listed in PROFILE-SCHEMA.md, "execution".
  model_profile: balanced
  intended_effort: "high"
  agent_model_overrides: {}        # per-agent, wins over the profile
  agent_effort_overrides: {}       # per-agent effort: low | medium | high | xhigh | max

language:
  docs: "en"
  conversation: "vi"
