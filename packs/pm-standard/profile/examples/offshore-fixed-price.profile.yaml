# ============================================================================
#  EXAMPLE PROFILE — offshore fixed-price delivery for a Japanese client,
#  managed alongside sdlc-standard.
#
#  Illustrates the strict end of the range: formal approvals, a CCB and a
#  steering committee, payment-linked milestones, two reserves, monthly audits,
#  bilingual reporting, and a warranty period after acceptance.
#  Compare with internal-agile.profile.yaml.
# ============================================================================
schema_version: "1.0"

project:
  key: KRS
  name: "在庫管理システム刷新 / Inventory Management System Renewal"
  code: "KRS-2026-001"
  vendor: "Offshore Development Partner Co., Ltd."
  client: "Kariya Retail Systems K.K."
  copyright: "(c) 2026 Kariya Retail Systems K.K. All rights reserved."
  start_date: "2026-02-02"
  planned_end_date: "2026-12-18"
  delivery_model: waterfall
  contract_type: fixed-price
  currency: "JPY"
  engagement_model: offshore
  time_zones: ["Asia/Tokyo", "Asia/Ho_Chi_Minh"]

governance:
  sponsor: "情報システム部 部長 (Client IS Department Head)"
  client_pm: "業務推進課 課長 (Client Business Promotion Manager)"
  project_manager: "Offshore Project Manager"
  technical_lead: "Offshore Technical Lead"
  qa_lead: "Offshore QA Manager"
  delivery_manager: "Offshore Delivery Director"
  ccb:
    members: ["client_pm", "project_manager", "technical_lead", "qa_lead"]
    chair: "client_pm"
    cadence: "weekly, Wednesday 14:00 JST"
    quorum: 3
  steering_committee:
    members: ["sponsor", "client_pm", "delivery_manager", "project_manager"]
    cadence: "monthly, first Tuesday"
    decides: ["baseline re-set", "scope trade-off", "escalated risk acceptance",
              "change requests above 40 person-hours"]
  escalation:
    - level: 1
      to: "project_manager"
      sla_hours: 4
    - level: 2
      to: "delivery_manager"
      sla_hours: 24
    - level: 3
      to: "steering_committee"
      sla_hours: 72
  approvals:
    charter: ["sponsor", "client_pm"]
    scope_baseline: ["client_pm", "project_manager"]
    schedule_baseline: ["client_pm", "project_manager"]
    cost_baseline: ["sponsor", "delivery_manager"]
    quality_plan: ["qa_lead", "client_pm"]
    test_plan: ["qa_lead", "client_pm"]
    change_request: ["ccb"]
    acceptance: ["client_pm", "sponsor"]
    closure: ["sponsor", "client_pm", "delivery_manager"]

calendar:
  working_days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
  hours_per_day: 8
  productive_hours_per_day: 6.0     # offshore: daily overlap meeting + clarification load
  holidays_calendar: "pm/resource/holidays-jp-vn-2026.md"
  planned_absence_allowance: "10%"  # includes Tet, which removes a full week in February
  freeze_periods:
    - name: "Client year-end close"
      from: "2026-03-25"
      to: "2026-04-05"
      reason: "会計年度末、本番環境変更禁止 (DEC-009)"
    - name: "Tet holiday"
      from: "2026-02-14"
      to: "2026-02-22"
      reason: "delivery-side national holiday; no development capacity"

scope:
  objectives:
    - statement: "Reduce stocktaking time at each depot"
      measure: "hours per full depot stocktake, from the handheld log"
      target: "from 11 h to under 4 h by 2027/01/31"
    - statement: "Eliminate manual re-keying into the accounting system"
      measure: "count of manual journal entries from inventory data per month"
      target: "from ~320 to 0 by go-live"
  in_scope:
    - "入荷・出荷・棚卸の業務管理 (receiving, shipping, stocktaking)"
    - "ハンディ端末による現場作業 (handheld terminal operations)"
    - "基幹会計システムとの日次連携 (nightly accounting interface)"
  out_of_scope:
    - item: "会計システム本体の改修"
      reason: "別ベンダー管理。インタフェース仕様のみ合意 (DEC-004)"
    - item: "EDI 受発注"
      reason: "第2フェーズ、本契約の範囲外 (契約書 別紙2)"
    - item: "Depot master data cleansing"
      reason: "client-side activity, tracked as DEP-002; project consumes the result"
  deliverables:
    - id: "D-001"
      name: "要件定義書 (SRS)"
      kind: "document"
      acceptance_by: "client_pm"
      acceptance_criteria: "every REQ traceable to a BR, reviewed with zero open Critical findings"
      due_milestone: "M1"
    - id: "D-002"
      name: "基本設計書一式 (Basic design set)"
      kind: "document"
      acceptance_by: "client_pm"
      acceptance_criteria: "all categories complete, SC/FC/API cross-checks pass"
      due_milestone: "M2"
    - id: "D-005"
      name: "本番システム (Production system)"
      kind: "software"
      acceptance_by: "client_pm"
      acceptance_criteria: "UAT complete, zero open S1/S2, acceptance record signed"
      due_milestone: "M5"
    - id: "D-006"
      name: "運用手順書・操作研修 (Runbook and training)"
      kind: "training"
      acceptance_by: "sponsor"
      acceptance_criteria: "client operators complete a stocktake unaided on the UAT environment"
      due_milestone: "M5"
  requirements:
    source: "docs/01.要件定義/SRS.md"
    id_format: "REQ-{AREA}-{NNN}"
    traceability: "docs/traceability.csv"
    owner: "client_pm"
    change_threshold_requires_cr: "any change to a baselined requirement"
  assumptions_log: "pm/registers/assumption-log.md"
  constraints:
    - "Handheld hardware fixed to the client's existing Keyence terminals (contract §4.2)"
    - "Accounting interface format frozen by the other vendor; change needs 6 weeks notice"
    - "No production data may leave Japan (client security policy SEC-11)"
  dependencies:
    - id: "DEP-001"
      description: "Accounting interface specification from the incumbent vendor"
      owner: "client_pm → incumbent vendor"
      needed_by: "2026-04-10"
      impact_if_late: "KRS.3.4 and KRS.4.6 stall; M2 at risk"
    - id: "DEP-002"
      description: "Cleansed depot master data"
      owner: "Client IS"
      needed_by: "2026-08-01"
      impact_if_late: "IT and ST cannot use realistic data; ST entry criteria fail"

wbs:
  code_format: "{key}.{L1}.{L2}.{L3}"
  max_levels: 4
  work_package_min_hours: 8
  work_package_max_hours: 64        # tightened: one reporting week at this team's capacity
  control_account_level: 2
  dictionary_fields: ["code", "name", "description", "deliverable", "owner", "predecessors",
                      "effort_hours", "duration_days", "cost", "acceptance_criteria",
                      "assumptions", "risks"]
  level1:
    - code: "1"
      name: "プロジェクト管理 (Project management)"
    - code: "2"
      name: "要件定義 (Requirements)"
    - code: "3"
      name: "基本設計 (Basic design)"
    - code: "4"
      name: "詳細設計・実装 (Detail design and implementation)"
    - code: "5"
      name: "テスト (Testing)"
    - code: "6"
      name: "移行・リリース (Migration and release)"
    - code: "7"
      name: "品質保証・プロセス (QA and process)"
    - code: "8"
      name: "研修・引継ぎ (Training and handover)"

schedule:
  method: critical-path
  baseline_path: "pm/schedule/schedule-baseline.md"
  working_file: "pm/schedule/schedule.md"
  tool: "MS Project, exported weekly to pm/schedule/"
  progress_measurement: "0-50-100"
  buffer_policy:
    project_buffer: "12% of critical path duration"
    feeding_buffer: "5% of each feeding chain"
    padding_inside_estimates: forbidden
  milestones:
    - id: "M0"
      name: "キックオフ (Kickoff)"
      date: "2026-02-02"
      criteria: "charter approved, team onboarded, environments requested"
      payment_linked: false
    - id: "M1"
      name: "要件定義完了 (Requirements complete)"
      date: "2026-04-17"
      criteria: "SRS accepted, every REQ testable and traced, P1 gate passed"
      payment_linked: true
    - id: "M2"
      name: "基本設計完了 (Basic design complete)"
      date: "2026-07-03"
      criteria: "all design categories accepted, cross-checks pass, P2 gate passed"
      payment_linked: true
    - id: "M3"
      name: "結合テスト完了 (Integration test complete)"
      date: "2026-09-25"
      criteria: "IT exit criteria met, no open S1/S2"
      payment_linked: false
    - id: "M4"
      name: "システムテスト完了 (System test complete)"
      date: "2026-10-30"
      criteria: "every REQ and NFR has an executed ST case, NFR measurements recorded"
      payment_linked: true
    - id: "M5"
      name: "検収 (Acceptance)"
      date: "2026-12-11"
      criteria: "UAT complete, acceptance record signed, handover demonstrated"
      payment_linked: true
  variance_thresholds:
    green: "SPI >= 0.95 and no payment milestone at risk"
    amber: "SPI 0.90-0.95, or a milestone recoverable within the project buffer"
    red: "SPI < 0.90, or a payment milestone at risk, or buffer consumption above elapsed %"

cost:
  size_unit: person-hours
  estimation_methods: ["wbs-bottom-up", "three-point-pert", "parametric", "analogous"]
  productivity:
    basis: "measured on KRS-2024-007 (same stack, same client, 14 screens) — actuals in pm/closing/archive of that project"
    rates:
      - unit: "simple screen (PC)"
        hours: 18
      - unit: "complex screen (PC)"
        hours: 44
      - unit: "handheld screen"
        hours: 26
      - unit: "batch job"
        hours: 28
      - unit: "API endpoint"
        hours: 9
      - unit: "design document (JP)"
        hours: 8
    phase_distribution:
      management: "11%"
      requirements: "13%"
      design: "20%"
      implementation: "27%"
      testing: "24%"
      release: "5%"
  rates:
    - role: "Project Manager"
      location: "VN"
      rate: 5200
    - role: "BrSE"
      location: "VN"
      rate: 4800
    - role: "Developer"
      location: "VN"
      rate: 3400
    - role: "QA Engineer"
      location: "VN"
      rate: 3100
  contingency_percent: 12           # fixed-price, offshore, one unspecified external interface
  management_reserve_percent: 5
  baseline_path: "pm/cost/cost-baseline.md"
  earned_value:
    enabled: true
    eac_formula: current-rate
    report_with: ["SPI", "CPI", "SV", "CV", "EAC", "ETC", "VAC", "TCPI"]
  billing:
    model: "milestone"
    invoice_trigger: "milestone acceptance signed by client_pm"
    payment_terms_days: 45

process:
  lifecycle: "waterfall with phase gates, per sdlc-standard P0..P9"
  standard_ref: "ISO 9001 QMS (vendor), plus client 開発標準 v3.2"
  tailoring_record: "pm/process/tailoring.md"
  development_process_ref: ".claude/sdlc.profile.yaml"
  qa:
    owner: "qa_lead"
    activities: ["process audit", "peer-review compliance check", "metrics review",
                 "gate review", "corrective action tracking", "client standard compliance check"]
    audit_cadence: "monthly"
    audit_record: "pm/quality/audits"
  qc:
    activities: ["document review (JP native check)", "code review", "unit test",
                 "integration test", "system test", "UAT support"]
    entry_exit_criteria_ref: "pm/quality/quality-plan.md"
  process_assets: "pm/process/assets"
  definition_of_done:
    - "code reviewed and merged"
    - "unit tests pass, coverage target met"
    - "design document updated (JP) and its VN working copy regenerated"
    - "test case updated and executed"
    - "traceability row updated"
    - "no open Critical review finding"
  corrective_actions: "pm/registers/capa-log.md"

quality:
  plan_path: "pm/quality/quality-plan.md"
  test_plan_path: "pm/quality/master-test-plan.md"
  objectives:
    - attribute: "functional correctness"
      target: "zero open S1/S2 at acceptance"
      measured_by: "defect register"
    - attribute: "review effectiveness"
      target: ">= 2 findings per design document"
      measured_by: "review records in each document"
    - attribute: "Japanese document quality"
      target: "zero wording findings from the client reviewer on the second submission"
      measured_by: "client review comments per document"
  targets:
    review_density: ">= 2 findings per design document"
    design_defect_density: "0.5 - 2.0 per document"
    code_defect_density: "1 - 5 per KLOC"
    unit_coverage: "line >= 70%, branch >= 60%"
    phase_containment: ">= 80%"
    escaped_defects: "< 5% first found in UAT"
    ut_pass_rate: "100% before IT entry"
    requirement_coverage: "100% of REQ-* have at least one test case"
  test_levels:
    - id: UT
      owner: "developer"
      environment: "test"
      entry: "code complete, build passes"
      exit: "100% pass, coverage target met"
    - id: IT
      owner: "technical_lead"
      environment: "test"
      entry: "UT exit holds for every module in the flow"
      exit: "no open S1/S2"
    - id: ST
      owner: "qa_lead"
      environment: "staging"
      entry: "IT exit holds, release build deployed, cleansed master data loaded (DEP-002)"
      exit: "every REQ and NFR has an executed case, NFR measurements recorded"
    - id: UAT
      owner: "client_pm"
      environment: "uat"
      entry: "ST exit holds, UAT plan signed, client data ready, depot operators scheduled"
      exit: "acceptance recorded"
  defect_severity:
    - id: S1
      label: "Critical"
      definition: "unusable, data loss, no workaround"
      fix_sla_hours: 8
    - id: S2
      label: "High"
      definition: "major function unusable, costly workaround"
      fix_sla_hours: 48
    - id: S3
      label: "Medium"
      definition: "impaired, acceptable workaround"
      fix_sla_hours: 120
    - id: S4
      label: "Low"
      definition: "cosmetic or minor"
      fix_sla_hours: "next release"
  quality_report_cadence: "monthly, and at every phase gate"

risk:
  register: "pm/registers/risk-register.md"
  issue_log: "pm/registers/issue-log.md"
  categories: ["scope", "schedule", "cost", "quality", "resource", "technical",
               "external-dependency", "client", "contractual", "security", "compliance",
               "language-and-communication"]
  probability_scale:
    - {id: 1, label: "Rare", range: "< 10%"}
    - {id: 2, label: "Unlikely", range: "10-30%"}
    - {id: 3, label: "Possible", range: "30-50%"}
    - {id: 4, label: "Likely", range: "50-80%"}
    - {id: 5, label: "Almost certain", range: "> 80%"}
  impact_scale:
    - {id: 1, label: "Negligible", schedule: "< 2 days", cost: "< 1%"}
    - {id: 2, label: "Minor", schedule: "2-5 days", cost: "1-3%"}
    - {id: 3, label: "Moderate", schedule: "1-2 weeks", cost: "3-7%"}
    - {id: 4, label: "Major", schedule: "2-4 weeks", cost: "7-15%"}
    - {id: 5, label: "Severe", schedule: "a payment milestone missed", cost: "> 15%"}
  exposure_thresholds:
    low: "1-6"
    medium: "8-12"
    high: "15-25"
  response_types: ["avoid", "mitigate", "transfer", "accept", "escalate"]
  review_cadence: "weekly for high exposure, monthly for the full register"
  contingency_drawdown_log: "pm/cost/contingency-drawdown.md"
  escalate_above_exposure: 12        # lowered: fixed-price, so cost risk lands on the vendor
  issue_sla_hours: {S1: 4, S2: 24, S3: 72, S4: "next cycle"}

reporting:
  root: "pm/reports"
  rag_definitions:
    green: "on plan, or recoverable inside the buffer without a client decision"
    amber: "a decision or action is needed to stay on plan; named and dated"
    red: "a baseline will be missed unless something changes; escalated same day"
  cadences:
    - id: daily
      audience: ["project_manager", "technical_lead"]
      channel: "standup at the 13:00-14:00 JST overlap window, plus a written note"
      due: "within 1 hour of standup"
      content: ["yesterday done", "today planned", "blockers with owner and age",
                "defect inflow", "questions needing a JP-side answer"]
      max_length: "one screen"
      path: "pm/reports/daily"
    - id: weekly
      audience: ["client_pm", "delivery_manager", "project_manager"]
      channel: "JP written report plus a 30-minute call, Friday 16:00 JST"
      due: "Friday 14:00 JST"
      content: ["RAG with the reason", "milestone status", "SPI/CPI",
                "completed and planned work packages", "top 5 risks and issues",
                "decisions needed from the client with by-dates", "change requests in flight",
                "quality snapshot", "resource changes"]
      path: "pm/reports/weekly"
    - id: monthly
      audience: ["sponsor", "steering_committee", "client_pm"]
      channel: "JP report plus the steering meeting"
      due: "3rd working day of the following month"
      content: ["executive summary and RAG trend", "earned value", "milestone status",
                "quality report", "risk profile change", "cumulative CR impact",
                "resource utilisation", "decisions needed", "forecast to completion"]
      path: "pm/reports/monthly"
    - id: quarterly
      audience: ["sponsor", "steering_committee"]
      channel: "business review"
      due: "within 10 working days of quarter end"
      content: ["objective attainment vs charter", "financial performance",
                "baseline history", "risk outlook", "quality trend", "lessons applied",
                "next-quarter plan"]
      path: "pm/reports/quarterly"
    - id: quality
      audience: ["qa_lead", "client_pm", "delivery_manager"]
      channel: "JP written report"
      due: "monthly, and at every gate"
      content: ["review density", "defect density by phase and module",
                "phase containment matrix", "test progress per level", "coverage",
                "escaped defects", "S-curve shape", "audit findings and CAPAs",
                "what the numbers predict"]
      path: "pm/reports/quality"
  data_sources:
    progress: "Jira (KRS board) and pm/schedule/schedule.md"
    effort: "vendor timesheet system, booked to WBS codes"
    defects: "Jira (KRS-BUG project)"
    test_results: "test/results/"
    build: "GitHub Actions"
  distribution_list: ["client_pm", "sponsor", "delivery_manager", "qa_lead"]
  meeting_minutes: "pm/meetings"
  action_item_log: "pm/registers/action-log.md"

change_control:
  id_format: "CR-{NNN}"
  register: "pm/changes/change-register.md"
  request_dir: "pm/changes"
  impact_dimensions: ["scope", "schedule", "cost", "quality", "risk", "resource",
                      "contract", "dependencies", "test", "documentation", "translation"]
  min_options: 2
  authority:
    - limit: "<= 8 person-hours, no milestone impact, no document baseline change"
      approver: "project_manager"
    - limit: "<= 40 person-hours or <= 3 days schedule impact"
      approver: "ccb"
    - limit: "anything larger, or any payment-milestone impact"
      approver: "steering_committee"
  require_estimate: true
  rebaseline_policy: "steering-committee approval only; previous baseline retained with its variance"
  classes: ["CR-SCOPE-ADD", "CR-SCOPE-REMOVE", "CR-REQUIREMENT", "CR-DESIGN", "CR-SCHEDULE",
            "CR-COST", "CR-QUALITY", "CR-PROCESS", "CR-CONTRACT", "CR-CLARIFY"]

resource:
  plan_path: "pm/resource/staffing-plan.md"
  raci_path: "pm/resource/raci.md"
  roles:
    - role: "Project Manager"
      count: 1
      allocation_percent: 80
      start: "2026-02-02"
      end: "2026-12-18"
      location: "VN"
      skills_required: ["PMP or equivalent", "offshore JP delivery"]
    - role: "BrSE"
      count: 2
      allocation_percent: 85
      start: "2026-02-02"
      end: "2026-12-18"
      location: "VN"
      skills_required: ["JLPT N2+", "requirement analysis", "JP document writing"]
    - role: "Developer"
      count: 6
      allocation_percent: 85
      start: "2026-04-01"
      end: "2026-11-20"
      location: "VN"
      skills_required: [".NET 9", "React 19", "SQL Server"]
    - role: "QA Engineer"
      count: 2
      allocation_percent: 85
      start: "2026-06-01"
      end: "2026-12-11"
      location: "VN"
      skills_required: ["test design", "Playwright", "JP reading"]
  onboarding_checklist: "pm/resource/onboarding.md"
  max_planned_allocation_percent: 85
  key_person_risk: "every role with a single holder is a RSK-* entry"
  subcontract:
    used: false
    parties: []
    sla_ref: ""
  utilisation_report: "pm/reports/monthly"

closing:
  acceptance_record: "pm/closing/acceptance-record.md"
  final_report: "pm/closing/final-report.md"
  lessons_learned: "pm/closing/lessons-learned.md"
  archive_root: "pm/closing/archive"
  handover:
    items: ["source and build pipeline", "deployment runbook (JP)", "operations manual (JP)",
            "known issues and workarounds", "support contacts and escalation",
            "credentials transfer record", "operator training delivered",
            "open CR backlog with estimates"]
    to: "Client IS Operations Team"
  contract_closure:
    final_invoice_condition: "acceptance record signed by client_pm and sponsor"
    warranty_period: "3 months after acceptance (契約書 §9)"
    retained_obligations: ["warranty defect fixing", "2 knowledge transfer sessions",
                           "handheld firmware compatibility confirmation"]
  resource_release: "pm/closing/resource-release.md"
  post_implementation_review_after_days: 60

paths:
  pm_root: "pm"
  charter: "pm/charter/project-charter.md"
  plan_root: "pm/plan"
  project_management_plan: "pm/plan/project-management-plan.md"
  scope_statement: "pm/scope/scope-statement.md"
  scope_baseline: "pm/scope/scope-baseline.md"
  wbs: "pm/scope/wbs.xlsx"
  wbs_dictionary: "pm/scope/wbs.xlsx"
  schedule_root: "pm/schedule"
  cost_root: "pm/cost"
  estimate: "pm/cost/estimate.md"
  process_root: "pm/process"
  quality_root: "pm/quality"
  risk_root: "pm/registers"
  reports_root: "pm/reports"
  changes_root: "pm/changes"
  resource_root: "pm/resource"
  meetings: "pm/meetings"
  closing_root: "pm/closing"
  registers: "pm/registers"
  decision_log: "pm/registers/decision-log.md"
  status_data: "pm/reports/_data"

# The client receives Word for narrative documents and Excel for everything
# tabular - their QMS parses both. Their own forms are registered per artifact.
documents:
  formats_enabled: [md, xlsx, docx, csv]
  working_dir: "pm/_working"
  working_retention: delete-on-finalise
  derived_view: true
  registry:
    - artifact: wbs
      path: "pm/scope/wbs.xlsx"
      format: xlsx
      working: [md, csv]
      template: "pm/_templates/WBS_form.xlsx"     # the client's own form
      sheets: {wbs: "WBS", dictionary: "WBS Dictionary"}
      dictionary_in_same_workbook: true
    - artifact: wbs_dictionary
      path: "pm/scope/wbs.xlsx"
      format: xlsx
      working: [md, csv]
      template: ""
    - artifact: estimate
      path: "pm/cost/estimate.xlsx"
      format: xlsx
      working: [md, csv]
      template: "pm/_templates/Estimate_form.xlsx"
    - artifact: cost_baseline
      path: "pm/cost/cost-baseline.xlsx"
      format: xlsx
      working: [md, csv]
      template: ""
    - artifact: schedule
      path: "pm/schedule/schedule.xlsx"
      format: xlsx
      working: [md, csv]
      template: ""
    - artifact: risk_register
      path: "pm/registers/risk-register.xlsx"
      format: xlsx
      working: [md, csv]
      template: "pm/_templates/Risk_register_form.xlsx"
    - artifact: charter
      path: "pm/charter/project-charter.docx"
      format: docx
      working: [md]
      template: "pm/_templates/Charter_form.docx"
    - artifact: project_management_plan
      path: "pm/plan/project-management-plan.docx"
      format: docx
      working: [md]
      template: "pm/_templates/PMP_form.docx"
    - artifact: scope_statement
      path: "pm/scope/scope-statement.docx"
      format: docx
      working: [md]
      template: ""
    - artifact: status_report
      path: "pm/reports"
      format: docx
      working: [md]
      template: "pm/_templates/Weekly_report_form.docx"
  binary_final: [wbs, wbs_dictionary, estimate, cost_baseline, charter,
                 project_management_plan, status_report]

baselines:
  change_requires_cr: true
  active_cr_file: ".claude/.active_pm_cr"
  readonly_globs:
    - "pm/closing/archive/**"
    - "pm/**/_baselined/**"
  registered:
    - path: "pm/charter/project-charter.md"
      artifact: "charter"
      version: "1.0"
      approved_by: "sponsor, client_pm"
      approved_on: "2026/02/06"

document:
  revision_table_headers: ["版", "日付", "変更内容", "作成者", "レビュー者", "承認者", "承認日"]
  initial_version: "0.1"
  baseline_version: "1.0"
  auto_version_bump: false
  date_format: "YYYY/MM/DD"
  diagram_tool: mermaid
  require_approval_block: true
  require_distribution_list: true
  confidentiality: "社外秘 - Kariya Retail Systems K.K. および受託者限り"
  footer: "{{profile.project.copyright}}"

language:
  primary: ja                      # management deliverables to the client are Japanese
  working: vi                      # the team converses in Vietnamese
  client_facing: ja
  by_path:
    - path: "pm/reports/**"
      lang: ja
    - path: "pm/charter/**"
      lang: ja
    - path: "pm/plan/**"
      lang: ja
    - path: "pm/registers/**"
      lang: vi                     # internal working registers
    - path: "pm/meetings/**"
      lang: ja                     # client-attended meetings; internal ones may be vi
  immutable_tokens:
    - "WBS codes"
    - "milestone IDs"
    - "risk / issue / CR / decision IDs"
    - "deliverable IDs"
    - "requirement IDs"
    - "metric names and formulas"
    - "currency amounts"

integration:
  technical_pack: sdlc
  technical_profile_path: ".claude/sdlc.profile.yaml"
  bindings:
    work_package_to_deliverable: true
    milestone_to_phase_gate: true
    quality_targets: "inherit"
    defect_register: "technical"
    test_levels: "technical"
  milestone_gate_map:
    - milestone: "M1"
      gate: "P1_requirements"
    - milestone: "M2"
      gate: "P2_basic_design"
    - milestone: "M3"
      gate: "P6_integration_test"
    - milestone: "M4"
      gate: "P7_system_test"
    - milestone: "M5"
      gate: "P8_uat"

execution:
  # Model and effort profile for the pm-* agents. Each agent is in one tier:
  #   heavy    - analysis, design, review, triage: silent failure modes that
  #              only surface at review, UAT or the steering committee.
  #   standard - production work from an approved document (code, tests,
  #              infra, mockups, reports), checked by build, tests and review.
  # quality  : heavy opus xhigh,   standard opus high
  # balanced : heavy opus high,    standard sonnet medium   (pack default)
  # budget   : heavy sonnet high,  standard sonnet medium
  # The tier of every agent is listed in PROFILE-SCHEMA.md, "execution".
  model_profile: quality
  agent_model_overrides: {}        # per-agent, wins over the profile
  agent_effort_overrides: {}       # per-agent effort: low | medium | high | xhigh | max
  intended_effort: "xhigh"
