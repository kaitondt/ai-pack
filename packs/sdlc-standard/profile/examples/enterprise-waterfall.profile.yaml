# ============================================================================
#  EXAMPLE PROFILE — offshore enterprise build, fixed-price waterfall,
#  Japanese deliverables with a Vietnamese working copy
#
#  Illustrates the strict end of the configuration range: hard gates, formal
#  baselines, two deliverable languages, report and file-interface categories,
#  a client-owned CR list and a contractual warranty period.
#  Compare with saas-webapp.profile.yaml.
# ============================================================================
schema_version: "1.0"

project:
  key: KRS
  name: "在庫管理システム刷新 / Inventory Management System"
  vendor: "Offshore Development Partner Co., Ltd."
  client: "Kariya Retail Systems K.K."
  copyright: "(c) 2026 Kariya Retail Systems K.K. All rights reserved."
  start_date: "2026-02-02"
  delivery_model: waterfall
  contract_type: fixed-price
  release_cadence: "single release at acceptance, then quarterly maintenance releases"

stakeholders:
  business_owner: "情報システム部 部長 (Client IS Department Head)"
  product_owner: "業務推進課 課長 (Client Business Promotion Manager)"
  architect: "Offshore Technical Lead"
  qa_lead: "Offshore QA Manager"
  ops_owner: "Client IS Operations Team Lead"
  approvers: ["Client Internal Audit (for NFR-COMPL-*)"]

scope:
  in_scope:
    - "入荷・出荷・棚卸の業務管理 (receiving, shipping, stocktaking)"
    - "ハンディ端末による現場作業 (handheld terminal operations)"
    - "基幹会計システムとの日次連携 (daily interface to the accounting system)"
  out_of_scope:
    - item: "会計システム本体の改修"
      reason: "別ベンダー管理、インタフェース仕様のみ合意 (DEC-004)"
    - item: "EDI 受発注"
      reason: "第2フェーズ、本契約の範囲外 (契約書 別紙2)"
  external_systems:
    - name: "基幹会計システム (Accounting)"
      owner: "Client, maintained by another vendor"
      interface: "fixed-width file over SFTP, nightly"
      contract_ref: "docs/02.基本設計/07.ファイル設計/ACC-FL-001.md"
    - name: "取引先マスタ配信 (Partner master feed)"
      owner: "Client IS"
      interface: "CSV over SFTP, weekly"
      contract_ref: "docs/02.基本設計/07.ファイル設計/PTM-FL-001.md"

system:
  root: "src"
  architecture: "Clean Architecture (Domain / Application / Infrastructure / Presentation)"
  stack:
    backend: ".NET 9 / ASP.NET Core Web API"
    frontend: "React 19 + Vite + TypeScript"
    database: "SQL Server 2022"
    data_access: "Dapper over stored procedures"
    auth: "JWT Bearer, client Active Directory as the identity source"
    package_manager: "pnpm workspaces"
    infrastructure: "Client on-premise, Windows Server + IIS"
  surfaces:
    - id: PC
      label: "デスクトップ (Desktop browser)"
      id_suffix: "PG"
      viewport: "1366x768+"
    - id: HH
      label: "ハンディ端末 (Handheld terminal)"
      id_suffix: "HG"
      viewport: "320x534"
  environments:
    - {id: local, purpose: "development", data: "synthetic"}
    - {id: test, purpose: "UT / IT", data: "synthetic"}
    - {id: staging, purpose: "総合テスト (ST)", data: "masked production copy", production_like: true}
    - {id: uat, purpose: "受入テスト (UAT)", data: "client-prepared", }
    - {id: prod, purpose: "本番 (live)", data: "live"}
  build:
    order:
      - "pnpm install --frozen-lockfile"
      - "pnpm --filter @krs/shared build"
      - "pnpm --filter @krs/ui build"
      - "dotnet build src/backend/Krs.sln -c Release"
      - "pnpm --filter @krs/desktop build"
      - "pnpm --filter @krs/handy build"
    typecheck: "pnpm typecheck"
    lint: "pnpm lint && dotnet format --verify-no-changes"
    test_unit: "dotnet test src/backend/Krs.sln && pnpm test:unit"
    test_integration: "dotnet test src/backend/Krs.Functional.Tests"
    test_e2e: "pnpm test:e2e"

ids:
  module_pattern: "^KK[0-9]{4}(PG|HG|BT)$"
  module_example: "KK0030PG"
  doc_id_format: "{MODULE}-{TYPE}-{NNN}"
  types: {screen: SC, function: FC, api: API, data: DT, batch: BT, report: RP, file: FL, detail: DD}
  business_requirement_id_format: "BR-{AREA}-{NNN}"
  requirement_id_format: "REQ-{AREA}-{NNN}"
  nfr_id_format: "NFR-{CATEGORY}-{NNN}"
  assumption_id_format: "ASM-{NNN}"
  decision_id_format: "DEC-{NNN}"
  risk_id_format: "RSK-{NNN}"
  message_id_format: "MSG-{MODULE_BASE}-{NNN}"
  test_id_format:
    unit: "UT-{MODULE}-{NNN}"
    integration: "IT-{FLOW}-{NNN}"
    system: "ST-{SCENARIO}-{NNN}"
    acceptance: "UAT-{NNN}"
  defect_id_format: "BUG-{NNN}"
  incident_id_format: "INC-{YYYY}-{NNN}"
  number_width: 3

paths:
  docs_root: "docs"
  inception: "docs/00.企画"
  requirements: "docs/01.要件定義"
  design_root: "docs/02.基本設計"
  detail_design: "docs/03.詳細設計"
  test_design: "docs/04.テスト設計"
  reviews: "docs/レビュー記録"
  drift_reports: "docs/差異報告"
  uat: "docs/09.uat"
  maintenance: "docs/10.maintenance"
  change_requests: "docs/11.change-requests"
  bug_traces: "docs/12.bug-trace"
  traceability: "docs/traceability.csv"
  decision_log: "docs/00.企画/決定事項一覧.md"
  assumption_log: "docs/00.企画/前提条件一覧.md"
  risk_register: "docs/00.企画/リスク管理表.md"
  glossary: "docs/00.企画/用語集.md"
  metrics: "docs/品質記録"
  runbook: "docs/運用/運用手順書.md"
  bd_categories:
    - {key: architecture, dir: "01.方式設計", skill: sdlc-basic-design}
    - {key: nfr,          dir: "02.非機能設計", skill: sdlc-nfr-design}
    - {key: screen,       dir: "03.画面設計", skill: sdlc-screen-design}
    - {key: function,     dir: "04.機能設計", skill: sdlc-function-design}
    - {key: data,         dir: "05.DB設計", skill: sdlc-data-design}
    - {key: interface,    dir: "06.インタフェース設計", skill: sdlc-api-design}
    - {key: file,         dir: "07.ファイル設計", skill: sdlc-basic-design}
    - {key: report,       dir: "08.帳票設計", skill: sdlc-basic-design}
    - {key: batch,        dir: "09.バッチ設計", skill: sdlc-batch-design}

language:
  primary: ja                    # deliverables handed to the client are Japanese
  working: vi                    # the offshore team converses in Vietnamese
  by_path:
    - {path: "docs/**", lang: ja}
    - {path: "docs_vn/**", lang: vi}      # working copies, not deliverables
    - {path: "docs/09.uat/**", lang: ja}
    - {path: "docs/11.change-requests/**", lang: vi}
    - {path: "docs/10.maintenance/**", lang: vi}
    - {path: "docs/12.bug-trace/**", lang: ja}    # 混入原因・流出原因 analyses are submitted to the client
  immutable_tokens:
    - "module IDs"
    - "document IDs"
    - "requirement IDs"
    - "MSG-IDs"
    - "table and column names"
    - "stored-procedure names"
    - "API paths and field names"
    - "file paths and URLs"
    - "code blocks"
  dictionary: "docs/00.企画/dictionary.csv"
  grammar_fixes: "docs/00.企画/fix_grammar.csv"

document:
  revision_table_headers: ["版数", "日付", "変更内容", "作成者", "レビュー者", "承認者", "承認日"]
  initial_version: "0.1.0"
  baseline_version: "1.0.0"
  initial_change_text: "初版作成"
  auto_version_bump: false
  date_format: "YYYY/MM/DD"
  diagram_tool: mermaid
  diagram_constraints:
    - "flowchart TD only for processing flows"
    - "client viewer is mermaid 9.x — no newer shapes"
  require_review_record: true
  footer: "(c) 2026 Kariya Retail Systems K.K. All rights reserved."

# The client supplies every form, in Excel, and the forms are contractual.
# Nothing here is the pack's own skeleton: on_missing is `ask` so a category
# with no registered form stops rather than inventing one.
templates:
  root: "docs/templates"
  on_missing: ask
  formats_enabled: [md, xlsx, docx, csv]
  registry:
    - key: screen
      path: "docs/templates/画面設計書_様式.xlsx"
      format: xlsx
      output_format: xlsx
      sheet: "画面設計"
      header_rows: 8             # client header block: doc id, system, approval stamps
      fields: []                 # derived from the form's own placeholders
      status: provided
    - key: function
      path: "docs/templates/機能設計書_様式.xlsx"
      format: xlsx
      output_format: xlsx
      sheet: "機能設計"
      header_rows: 8
      fields: []
      status: provided
    - key: data
      path: "docs/templates/テーブル定義書_様式.xlsx"
      format: xlsx
      output_format: xlsx
      sheet: "テーブル定義"
      header_rows: 6
      fields: []
      status: provided
    - key: interface
      path: "docs/templates/IF設計書_様式.xlsx"
      format: xlsx
      output_format: xlsx
      sheet: "IF定義"
      header_rows: 6
      fields: []
      status: provided
    - key: requirements
      path: "docs/templates/要件定義書_様式.docx"
      format: docx
      output_format: docx
      fields: []
      status: provided
    - key: test_it
      path: "docs/templates/テスト仕様書_様式.xlsx"
      format: xlsx
      output_format: xlsx
      sheet: "テストケース"
      header_rows: 5
      fields: []
      status: provided
  template_wins_over_skill: true
  preserve_unfilled_structure: true

mockup:
  enabled: true
  kind: html                     # delivered to the client as openable files, no toolchain
  dir: "docs/02.基本設計/09.モックアップ"
  surfaces: [PC, HH]
  naming: "{MODULE}_{screen name}"
  html:
    self_contained: true         # the client opens these from a file share, offline
    shared_assets: "_assets"
    viewport_per_surface: true
  figma:
    file_url: ""
    access: ""
    export_dir: ""
    writable: false
  canvas:
    artifact_url: ""
  states_required: [normal, empty, loading, error, no-permission]
  cross_check_with_screen_design: true

# The client's IS department owns every environment. The project proposes
# changes; it does not commit them. repo_may_write_infra is false for exactly
# that reason - see DEC-012.
infrastructure:
  scm:
    platform: azure-repos
    host: cloud
    remote_url: "https://dev.azure.com/kariya-retail/KRS/_git/KRS"
    default_branch: main
    branching_model: release-branch
    review_unit: "pull request"
    protected_branches: ["main", "release/*"]
  ci:
    platform: azure-pipelines
    definition_path: "azure-pipelines.yml"
    runs_on: "self-hosted"       # client network, no outbound internet
    stages: [build, typecheck, lint, test_unit, test_integration, package]
    enforces_gates: [P4_implementation]
    artifact_retention_days: 365 # contractual: retained for the warranty period
  cd:
    strategy: manual             # client IS deploys; the project hands over a package
    approval_required_for: [staging, uat, prod]
    deployment_pattern: recreate
  hosting:
    provider: on-prem
    runtime: vm
    regions: ["client data centre, Nagoya"]
  containers:
    enabled: false
    runtime: none
    registry: ""
    compose_for_local: true
  iac:
    tool: none                   # environments are hand-built by client IS
    root: "infra"
    state_backend: "n/a"
    # No IaC means the rebuild procedure lives in the runbook instead, and the
    # rebuild risk is recorded as RSK-007 rather than left implicit.
    manual_changes_allowed: true
  secrets:
    store: "client-managed credential store; .env.example documents the keys"
    rotation_policy: "client policy, 180 days"
  observability:
    logs: "client syslog aggregation"
    metrics: "Zabbix (client-operated)"
    traces: "none"
    alerting: "client IS operations desk, 24/7 rota"
    nfr_monitors_required: true
  owner: "client ops"
  repo_may_write_infra: false

gates:
  P0_inception:
    entry: ["契約締結、業務オーナー確定"]
    exit:
      - "scope in/out documented, every out-of-scope item has a reason"
      - "stakeholder map, glossary, decision log and risk register exist"
      - "every BR-* has an owner and a priority"
      - "スコープ合意書に客先承認印がある"
  P1_requirements:
    entry: ["P0 exit holds"]
    exit:
      - "every REQ-* traces to a BR-* and is testable"
      - "every NFR-* states a measurable target and a measurement method"
      - "no requirement left in TBD"
      - "要件定義書 客先レビュー完了、承認済み"
  P2_basic_design:
    entry: ["要件定義書 baselined"]
    exit:
      - "/sdlc-review-design reports zero Critical findings"
      - "SC / FC / API / DT cross-checks pass"
      - "every REQ-* is realised by at least one design item"
      - "基本設計書 客先レビュー完了、承認済み"
      - "日本語成果物と日本語対訳の整合が取れている"
  P3_detail_design:
    entry: ["基本設計書 baselined for the module"]
    exit: ["every FC has a DD or an explicit no-DD decision",
           "the UT case basis is derivable from the DD",
           "差異報告のオープン項目がゼロ"]
  P4_implementation:
    entry: ["詳細設計書 approved for the module"]
    exit: ["/sdlc-verify-build passes", "/sdlc-review-commit reports zero Critical",
           "unit tests for the module pass"]
  P5_unit_test:
    entry: ["code complete for the module"]
    exit:
      - "every DD processing rule has at least one UT case"
      - "UT pass rate 100%"
      - "coverage meets line >= 70%, branch >= 60%"
      - "単体テスト報告書 提出済み"
  P6_integration_test:
    entry: ["UT exit holds for every module in the flow"]
    exit: ["every interface and screen flow has an IT case", "no open Critical or High defect",
           "結合テスト報告書 提出済み"]
  P7_system_test:
    entry: ["IT exit holds; staging deployed from a release build"]
    exit:
      - "every REQ-* and NFR-* has an executed ST case"
      - "no open Critical or High defect"
      - "NFR measurements recorded with their measurement method"
      - "総合テスト報告書 客先提出、品質指標が目標範囲内"
  P8_uat:
    entry: ["ST exit holds; UAT environment and client data ready; 受入テスト計画書 承認済み"]
    exit:
      - "every UAT scenario executed with a recorded verdict"
      - "every UAT defect closed, deferred with approval, or accepted"
      - "検収書 client-signed with approver and date"
  P9_maintenance:
    entry: ["検収完了、運用手順書と引継ぎ完了"]
    exit: ["every incident has a class, a root cause and a closure record",
           "every recurring incident has a preventive action or an accepted risk"]
  CR_change_request:
    - "the chosen option and its approver are recorded in the report"
    - "見積（工数・納期）が客先承認されている"
    - "every impact-matrix row marked required is done or deferred with a reason"
    - "design documents were updated before code"
    - "traceability rows for CR-sourced behaviour cite the CR id"

review:
  families: {common: true, requirement: true, screen: true, function: true,
             api: true, data: true, nfr: true, batch: true, report: true}
  severity_levels: ["Critical", "Warning", "Suggestion"]
  record_in_document: true
  output_dir: "docs/レビュー記録"

quality:
  size_unit: KLOC
  # Contractual quality targets, from the client's QMS standard.
  targets:
    review_density: "2 - 5 findings per design document"
    design_defect_density: "0.5 - 2.0 per document"
    code_defect_density: "1 - 5 per KLOC"
    test_density: ">= 15 UT cases per KLOC"
    unit_coverage: "line >= 70%, branch >= 60%"
    phase_containment: ">= 80% of defects found in the phase that injected them"
    ut_pass_rate: "100% before IT entry"
    escaped_defects: "< 5% of all defects first found in UAT"
  severity:
    - {id: S1, label: "致命的", definition: "業務停止、データ消失、回避策なし"}
    - {id: S2, label: "重大", definition: "主要機能が使用不可、回避策の負荷が高い"}
    - {id: S3, label: "中", definition: "機能に支障、実用的な回避策あり"}
    - {id: S4, label: "軽微", definition: "表示上の問題、軽微な不便"}
  injection_phases: [P1, P2, P3, P4, P5, P6, P7, P8]
  metrics_report: "docs/品質記録/品質報告書.md"

constraints:
  baseline_change_requires_cr: true
  production_change_via_release_only: true
  db_schema_owner: "this project"
  secrets_policy: "client-managed key store; no secrets in the repository"
  generated_files_glob: "**/*.generated.*"
  readonly_globs:
    - "**/*.generated.*"
    - "docs/**/_baselined/**"
    - "src/backend/**/Migrations/**"      # DBA-owned, delivered as scripts
  baselined:
    - {path: "docs/01.要件定義/要件定義書.md", version: "1.0.0", approved_on: "2026/04/10", cr_required: true}
    - {path: "docs/02.基本設計/01.方式設計/方式設計書.md", version: "1.0.0", approved_on: "2026/05/22", cr_required: true}

execution:
  # Model and effort profile for the sdlc-* agents. Each agent is in one tier:
  #   heavy    - analysis, design, review, triage: silent failure modes that
  #              only surface at review, UAT or the steering committee.
  #   standard - production work from an approved document (code, tests,
  #              infra, mockups, reports), checked by build, tests and review.
  # quality  : heavy opus xhigh,   standard opus high
  # balanced : heavy opus high,    standard sonnet medium   (pack default)
  # budget   : heavy sonnet high,  standard sonnet medium
  # The tier of every agent is listed in PROFILE-SCHEMA.md, "execution".
  model_profile: quality
  agent_model_overrides: {}        # per-agent, wins over the profile
  agent_effort_overrides: {}       # per-agent effort: low | medium | high | xhigh | max
  intended_effort: "xhigh"

testing:
  paths:
    testcase_root: "test/cases"
    step_subdir: "Step"
    it_plan: "test/it-plan"
    st_plan: "test/st-plan"
    uat_plan: "docs/09.uat/plan"
    automation_root: "test/automation"
    evidence_root: "test/evidence"
    results_root: "test/results"
  naming:
    module_dir: "UT_{BATCH}_{MODULE}"
    ut_file: "UT_{BATCH}_{MODULE}_{TS}.md"
    it_file: "IT_{FLOW}_{TS}.md"
    st_file: "ST_{SCENARIO}_{TS}.md"
    uat_file: "UAT_{SCENARIO}_{TS}.md"
    timestamp: "YYYYMMDD_HHmmss"
    batches: ["Pilot", "Batch1", "Batch2", "Batch3"]
  levels:
    - {id: UT, phase: P5, basis: detail_design, environment: test, owner: developer}
    - {id: IT, phase: P6, basis: design_root, environment: test, owner: developer}
    - {id: ST, phase: P7, basis: requirements, environment: staging, owner: qa_lead}
    - {id: UAT, phase: P8, basis: requirements, environment: uat, owner: business_owner}
  pipeline:
    human_pauses: ["after_qna", "after_checklist"]   # both kept: offshore, client Q&A has latency
    keep_retry_history: true
    max_review_rounds: 3
  viewpoints: [VP-01, VP-02, VP-03, VP-04, VP-05, VP-06, VP-07, VP-08, VP-09, VP-10]
  system_test:
    scenario_source: "業務プロセス単位、画面単位ではない"
    nfr_in_scope: true
    includes: ["regression", "performance", "security", "failover", "data volume", "operability",
               "月次・年次処理", "ハンディ端末実機"]
  uat:
    executed_by: client
    support_model: "現地立会い2名、当日中に一次回答"
    entry_signoff_required: true
    defect_sla_hours: {S1: 4, S2: 24, S3: 72, S4: "next release"}
  automation:
    framework: "Playwright + TypeScript"
    layout:
      specs: "test/automation/tests/{module}"
      page_objects: "test/automation/src/pages"
      data: "test/automation/src/data"
      fixtures: "test/automation/src/fixtures"
      db_client: "test/automation/src/db"
    spec_naming: "{module}.flow{N}.spec.ts"
    data_driven: true
    results_format: "allure"
  evidence:
    naming: "{TC_ID}_{seq}"
    formats: ["png", "csv", "log"]
    required_for: ["IT", "ST", "UAT"]     # client requires IT evidence as well
  rounds:
    count: 2
    columns: ["実施日", "実施者", "結果", "備考"]

change_request:
  id_format: "CR-{YYYY}-{NNN}"
  id_source: client                       # the client's 変更依頼管理表 owns the numbering
  min_options: 2
  gates: ["after_options", "after_design"]
  require_estimate: true                  # fixed-price: every CR is a contract amendment
  cascade: [requirements, nfr, data, screen, function, interface, detail, mockup,
            report, file, batch, indexes, translations, test_cases]
  update_test_cases: true
  classes: [CR-SCOPE, CR-UI, CR-FIELD, CR-LOGIC, CR-MESSAGE, CR-REPORT, CR-DATA,
            CR-NFR, CR-NEW, CR-REMOVE, CR-CLARIFY, CR-OUT-OF-SCOPE]

maintenance:
  support_window: "月-金 09:00-18:00 JST、祝日除く"
  warranty_period: "検収後6ヶ月 (contractual)"
  classes: [INC-DEFECT, INC-DATA, INC-ENV, INC-USAGE, INC-ENHANCEMENT, INC-EXTERNAL]
  sla:
    S1: {response_hours: 1, resolution_hours: 8}
    S2: {response_hours: 4, resolution_hours: 48}
    S3: {response_hours: 24, resolution_days: 10}
    S4: {response_hours: 72, resolution: "次回定期リリース"}
  hotfix:
    allowed: true
    approval: "ops_owner + product_owner"
    retro_documentation_days: 5
  rca_required_for: [S1, S2]
  regression_test_required: true
  knowledge_base: "docs/10.maintenance/knowledge-base.md"
