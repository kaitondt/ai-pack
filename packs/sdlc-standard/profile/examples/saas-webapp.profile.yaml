# ============================================================================
#  EXAMPLE PROFILE — internal SaaS product, iterative, one language
#
#  Illustrates a lighter configuration: agile-with-gates, a single deliverable
#  language, fewer design categories, and quality targets calibrated from the
#  team's own history rather than copied.
#  Compare with enterprise-waterfall.profile.yaml.
# ============================================================================
schema_version: "1.0"

project:
  key: ATLAS
  name: "Atlas — customer onboarding platform"
  vendor: "Platform Engineering"
  client: "Revenue Operations"
  copyright: "(c) 2026 Example Corp. Internal use only."
  start_date: "2026-01-13"
  # Sprints run inside P4-P6; only RA, BD, ST and UAT are hard gates.
  delivery_model: agile-with-gates
  contract_type: internal
  release_cadence: "fortnightly to staging, monthly to production"

stakeholders:
  business_owner: "Head of Revenue Operations"
  product_owner: "Product Manager, Onboarding"
  architect: "Principal Engineer, Platform"
  qa_lead: "QA Lead, Platform"
  ops_owner: "SRE on-call rota owner"
  approvers: ["Security Architect (for NFR-SEC-*)"]

scope:
  in_scope:
    - "self-service customer sign-up and verification"
    - "onboarding task tracking for the CS team"
    - "handover to the billing platform"
  out_of_scope:
    - item: "billing and invoicing"
      reason: "owned by the Billing platform team; integrated, not rebuilt"
    - item: "bulk import of historical customers"
      reason: "one-off migration, handled by a separate data project (DEC-008)"
  external_systems:
    - name: "Billing platform"
      owner: "Billing team"
      interface: "REST, internal service mesh"
      contract_ref: "docs/02.basic-design/06.interface-design/billing-v3.md"
    - name: "Identity provider"
      owner: "IT Security"
      interface: "OIDC"
      contract_ref: "external, vendor documentation v2026.1"

system:
  root: "src"
  architecture: "Modular monolith, module-per-bounded-context"
  stack:
    backend: "Node 22 + Fastify + TypeScript"
    frontend: "React 19 + Vite + TypeScript"
    database: "PostgreSQL 16"
    data_access: "Drizzle ORM"
    auth: "OIDC via the corporate identity provider, session cookies"
    package_manager: "pnpm workspaces"
    infrastructure: "AWS ECS + Terraform"
  surfaces:
    - id: PC
      label: "Desktop browser"
      id_suffix: "PG"
      viewport: "1280x800+"
    - id: MB
      label: "Mobile web"
      id_suffix: "MG"
      viewport: "375x812"
  environments:
    - id: local
      purpose: "development"
      data: "synthetic seed"
    - id: ci
      purpose: "UT / IT on every merge"
      data: "synthetic seed"
    - id: staging
      purpose: "ST and UAT"
      data: "masked production copy, refreshed weekly"
      production_like: true
    - id: prod
      purpose: "live"
      data: "live"
  build:
    order:
      - "pnpm install --frozen-lockfile"
      - "pnpm --filter @atlas/shared build"
      - "pnpm --filter @atlas/api build"
      - "pnpm --filter @atlas/web build"
    typecheck: "pnpm typecheck"
    lint: "pnpm lint"
    test_unit: "pnpm test:unit"
    test_integration: "pnpm test:integration"
    test_e2e: "pnpm test:e2e"

ids:
  module_pattern: "^ATL[0-9]{3}(PG|MG|BT)$"
  module_example: "ATL010PG"
  doc_id_format: "{MODULE}-{TYPE}-{NNN}"
  types: {screen: SC, function: FC, api: API, data: DT, batch: BT, report: RP, file: FL, detail: DD}
  business_requirement_id_format: "BR-{AREA}-{NNN}"
  requirement_id_format: "REQ-{AREA}-{NNN}"
  nfr_id_format: "NFR-{CATEGORY}-{NNN}"
  assumption_id_format: "ASM-{NNN}"
  decision_id_format: "DEC-{NNN}"
  risk_id_format: "RSK-{NNN}"
  message_id_format: "MSG-{MODULE_BASE}-{NNN}"
  test_id_format:
    unit: "UT-{MODULE}-{NNN}"
    integration: "IT-{FLOW}-{NNN}"
    system: "ST-{SCENARIO}-{NNN}"
    acceptance: "UAT-{NNN}"
  defect_id_format: "BUG-{NNN}"
  incident_id_format: "INC-{YYYY}-{NNN}"
  number_width: 3

paths:
  docs_root: "docs"
  inception: "docs/00.inception"
  requirements: "docs/01.requirements"
  design_root: "docs/02.basic-design"
  detail_design: "docs/03.detail-design"
  test_design: "docs/04.test-design"
  reviews: "docs/08.reviews"
  drift_reports: "docs/05.drift"
  uat: "08.uat"
  maintenance: "09.maintenance"
  change_requests: "10.change-requests"
  bug_traces: "11.bug-trace"
  traceability: "docs/traceability.csv"
  decision_log: "docs/00.inception/decision-log.md"
  assumption_log: "docs/00.inception/assumption-log.md"
  risk_register: "docs/00.inception/risk-register.md"
  glossary: "docs/00.inception/glossary.md"
  metrics: "docs/06.metrics"
  runbook: "docs/07.operations/runbook.md"
  # No report or file-interface categories: this product has neither.
  bd_categories:
    - {key: architecture, dir: "01.architecture", skill: sdlc-basic-design}
    - {key: nfr,          dir: "02.non-functional", skill: sdlc-nfr-design}
    - {key: screen,       dir: "03.screen-design", skill: sdlc-screen-design}
    - {key: function,     dir: "04.function-design", skill: sdlc-function-design}
    - {key: data,         dir: "05.data-design", skill: sdlc-data-design}
    - {key: interface,    dir: "06.interface-design", skill: sdlc-api-design}
    - {key: batch,        dir: "07.batch-design", skill: sdlc-batch-design}

language:
  primary: en
  working: en
  by_path:
    - {path: "docs/**", lang: en}
    - {path: "08.uat/**", lang: en}
    - {path: "11.bug-trace/**", lang: en}
  immutable_tokens:
    - "module IDs"
    - "document IDs"
    - "requirement IDs"
    - "MSG-IDs"
    - "table and column names"
    - "API paths and field names"
    - "file paths and URLs"
    - "code blocks"
  dictionary: ""
  grammar_fixes: ""

document:
  revision_table_headers: ["Version", "Date", "Change", "Author", "Reviewer", "Approver", "Approved on"]
  initial_version: "0.1.0"
  baseline_version: "1.0.0"
  initial_change_text: "Initial draft"
  auto_version_bump: false
  date_format: "YYYY-MM-DD"
  diagram_tool: mermaid
  diagram_constraints:
    - "flowchart TD only for processing flows"
    - "renders in GitHub markdown preview"
  require_review_record: true
  footer: "(c) 2026 Example Corp. Internal use only."

# Markdown throughout: the deliverables live in the repository and are reviewed
# in pull requests like code. No client form to honour - which is a choice the
# team made, recorded as DEC-004, not an absence of templates.
templates:
  root: "docs/templates"
  on_missing: skeleton           # agreed: the pack's structure is this team's structure
  formats_enabled: [md, csv]
  registry:
    - key: requirements
      path: "docs/templates/srs-section.md"
      format: md
      output_format: md
      fields: []
      status: provided
  template_wins_over_skill: true
  preserve_unfilled_structure: true

mockup:
  enabled: true
  kind: canvas                   # designers iterate on a shared canvas with the PM
  dir: "docs/02.basic-design/09.mockup"
  surfaces: [PC, MB]
  naming: "{MODULE}_{screen name}"
  html:
    self_contained: true
    shared_assets: "_assets"
    viewport_per_surface: true
  figma:
    file_url: ""
    access: ""
    export_dir: "docs/02.basic-design/09.mockup/_export"
    writable: false
  canvas:
    artifact_url: ""             # set on first publish, reused thereafter
  states_required: [normal, empty, loading, error, no-permission]
  cross_check_with_screen_design: true

infrastructure:
  scm:
    platform: github
    host: cloud
    remote_url: "https://github.com/example-corp/atlas"
    default_branch: main
    branching_model: trunk-based
    review_unit: "pull request"
    protected_branches: ["main"]
  ci:
    platform: github-actions
    definition_path: ".github/workflows/ci.yml"
    runs_on: "hosted runner"
    stages: [build, typecheck, lint, test_unit, test_integration, package]
    enforces_gates: [P4_implementation, P5_unit_test]
    artifact_retention_days: 30
  cd:
    strategy: pipeline-triggered
    approval_required_for: [prod]
    deployment_pattern: rolling
  hosting:
    provider: aws
    runtime: container
    regions: ["eu-west-1"]
  containers:
    enabled: true
    runtime: docker
    registry: "ghcr.io/example-corp"
    compose_for_local: true
  iac:
    tool: terraform
    root: "infra"
    state_backend: "S3 + DynamoDB lock"
    manual_changes_allowed: false
  secrets:
    store: "AWS Secrets Manager; GitHub environment secrets for CI"
    rotation_policy: "90 days"
  observability:
    logs: "CloudWatch Logs"
    metrics: "CloudWatch Metrics + Grafana"
    traces: "OpenTelemetry -> Tempo"
    alerting: "PagerDuty -> SRE on-call rota"
    nfr_monitors_required: true
  owner: "this project"
  repo_may_write_infra: true

gates:
  P0_inception:
    entry: ["a named business owner exists"]
    exit:
      - "scope in/out documented, every out-of-scope item has a reason"
      - "stakeholder map, glossary, decision log and risk register exist"
      - "every BR-* has an owner and a priority"
  P1_requirements:
    entry: ["P0 exit holds"]
    exit:
      - "every REQ-* traces to a BR-* and is testable"
      - "every NFR-* states a measurable target and a measurement method"
      - "no requirement left in TBD"
      - "SRS reviewed and baselined by the product owner"
  P2_basic_design:
    entry: ["SRS baselined"]
    exit:
      - "/sdlc-review-design reports zero Critical findings"
      - "SC / FC / API / DT cross-checks pass"
      - "every REQ-* is realised by at least one design item"
  P3_detail_design:
    entry: ["basic design baselined for the module"]
    exit: ["every FC has a DD or an explicit no-DD decision", "the UT case basis is derivable from the DD"]
  P4_implementation:
    entry: ["DD approved for the module"]
    exit: ["/sdlc-verify-build passes", "/sdlc-review-commit reports zero Critical", "unit tests pass"]
  P5_unit_test:
    entry: ["code complete for the module"]
    exit:
      - "every DD processing rule has at least one UT case"
      - "UT pass rate 100%"
      - "coverage meets line >= 80%, branch >= 70%"
  P6_integration_test:
    entry: ["UT exit holds for every module in the flow"]
    exit: ["every interface and screen flow has an IT case", "no open Critical or High defect"]
  P7_system_test:
    entry: ["IT exit holds; staging deployed from a release build"]
    exit:
      - "every REQ-* and NFR-* has an executed ST case"
      - "no open Critical or High defect"
      - "NFR measurements recorded with their method"
  P8_uat:
    entry: ["ST exit holds; staging refreshed; UAT plan agreed with Revenue Operations"]
    exit:
      - "every UAT scenario executed with a recorded verdict"
      - "every UAT defect closed, deferred with approval, or accepted"
      - "acceptance recorded with approver and date"
  P9_maintenance:
    entry: ["release live; runbook and on-call handover complete"]
    exit: ["every incident has a class, a root cause and a closure record",
           "every recurring incident has a preventive action or an accepted risk"]
  CR_change_request:
    - "the chosen option and its approver are recorded in the report"
    - "every impact-matrix row marked required is done or deferred with a reason"
    - "design documents were updated before code"
    - "traceability rows for CR-sourced behaviour cite the CR id"

review:
  families: {common: true, requirement: true, screen: true, function: true,
             api: true, data: true, nfr: true, batch: true, report: false}
  severity_levels: ["Critical", "Warning", "Suggestion"]
  record_in_document: true
  output_dir: "docs/08.reviews"

quality:
  size_unit: KLOC
  # Calibrated from this team's last four releases, reviewed each quarter.
  targets:
    review_density: ">= 3 findings per design document"
    design_defect_density: "0.5 - 2.5 per document"
    code_defect_density: "1 - 4 per KLOC"
    test_density: ">= 20 UT cases per KLOC"
    unit_coverage: "line >= 80%, branch >= 70%"
    phase_containment: ">= 85% of defects found in the phase that injected them"
    ut_pass_rate: "100% before IT entry"
    escaped_defects: "< 3% of all defects first found in UAT"
  severity:
    - {id: S1, label: "Critical", definition: "sign-up blocked, data loss, or no workaround"}
    - {id: S2, label: "High", definition: "major function unusable, workaround is costly"}
    - {id: S3, label: "Medium", definition: "function impaired, acceptable workaround exists"}
    - {id: S4, label: "Low", definition: "cosmetic or minor inconvenience"}
  injection_phases: [P1, P2, P3, P4, P5, P6, P7, P8]
  metrics_report: "docs/06.metrics/quality-report.md"

constraints:
  baseline_change_requires_cr: true
  production_change_via_release_only: true
  db_schema_owner: "this project"
  secrets_policy: "AWS Secrets Manager; .env.example documents required keys"
  generated_files_glob: "**/*.generated.*"
  readonly_globs:
    - "**/*.generated.*"
    - "src/**/drizzle/meta/**"
  baselined:
    - {path: "docs/01.requirements/SRS.md", version: "1.2.0", approved_on: "2026-03-06", cr_required: true}

execution:
  # Model and effort profile for the sdlc-* agents. Each agent is in one tier:
  #   heavy    - analysis, design, review, triage: silent failure modes that
  #              only surface at review, UAT or the steering committee.
  #   standard - production work from an approved document (code, tests,
  #              infra, mockups, reports), checked by build, tests and review.
  # quality  : heavy opus xhigh,   standard opus high
  # balanced : heavy opus high,    standard sonnet medium   (pack default)
  # budget   : heavy sonnet high,  standard sonnet medium
  # The tier of every agent is listed in PROFILE-SCHEMA.md, "execution".
  model_profile: balanced
  agent_model_overrides: {}        # per-agent, wins over the profile
  agent_effort_overrides: {}       # per-agent effort: low | medium | high | xhigh | max
  intended_effort: "xhigh"

testing:
  paths:
    testcase_root: "test/cases"
    step_subdir: "Step"
    it_plan: "test/it-plan"
    st_plan: "test/st-plan"
    uat_plan: "08.uat/plan"
    automation_root: "e2e"
    evidence_root: "test/evidence"
    results_root: "test/results"
  naming:
    module_dir: "UT_{BATCH}_{MODULE}"
    ut_file: "UT_{BATCH}_{MODULE}_{TS}.md"
    it_file: "IT_{FLOW}_{TS}.md"
    st_file: "ST_{SCENARIO}_{TS}.md"
    uat_file: "UAT_{SCENARIO}_{TS}.md"
    timestamp: "YYYYMMDD_HHmmss"
    batches: ["Pilot", "Sprint1", "Sprint2", "Sprint3"]
  levels:
    - {id: UT, phase: P5, basis: detail_design, environment: ci, owner: developer}
    - {id: IT, phase: P6, basis: design_root, environment: ci, owner: developer}
    - {id: ST, phase: P7, basis: requirements, environment: staging, owner: qa_lead}
    - {id: UAT, phase: P8, basis: requirements, environment: staging, owner: business_owner}
  pipeline:
    human_pauses: ["after_checklist"]   # Q&A pause dropped: the PO sits with the team
    keep_retry_history: true
    max_review_rounds: 3
  viewpoints: [VP-01, VP-02, VP-03, VP-04, VP-05, VP-06, VP-07, VP-08, VP-09, VP-10]
  system_test:
    scenario_source: "business process end to end, not screen by screen"
    nfr_in_scope: true
    includes: ["regression", "performance", "security", "failover", "data volume", "operability"]
  uat:
    executed_by: client                  # Revenue Operations, in-house
    support_model: "team on standby in the shared channel, defects triaged same day"
    entry_signoff_required: true
    defect_sla_hours: {S1: 4, S2: 24, S3: 72, S4: "next release"}
  automation:
    framework: "Playwright + TypeScript"
    layout:
      specs: "e2e/tests/{module}"
      page_objects: "e2e/src/pages"
      data: "e2e/src/data"
      fixtures: "e2e/src/fixtures"
      db_client: "e2e/src/db"
    spec_naming: "{module}.flow{N}.spec.ts"
    data_driven: true
    results_format: "playwright html + junit for CI"
  evidence:
    naming: "{TC_ID}_{seq}"
    formats: ["png", "csv", "log"]
    required_for: ["ST", "UAT"]
  rounds:
    count: 2
    columns: ["date", "tester", "result", "note"]

change_request:
  id_format: "CR-{NNN}"
  id_source: project                     # tracked in the team's own board
  min_options: 2
  gates: ["after_options", "after_design"]
  require_estimate: true                 # internal, but sprint capacity is finite
  cascade: [requirements, nfr, data, screen, function, interface, detail, mockup,
            batch, indexes, test_cases]
  update_test_cases: true
  classes: [CR-SCOPE, CR-UI, CR-FIELD, CR-LOGIC, CR-MESSAGE, CR-DATA, CR-NFR,
            CR-NEW, CR-REMOVE, CR-CLARIFY, CR-OUT-OF-SCOPE]

maintenance:
  support_window: "Mon-Fri 09:00-18:00 CET, on-call outside"
  warranty_period: "not applicable — internal product, continuous ownership"
  classes: [INC-DEFECT, INC-DATA, INC-ENV, INC-USAGE, INC-ENHANCEMENT, INC-EXTERNAL]
  sla:
    S1: {response_hours: 1, resolution_hours: 8}
    S2: {response_hours: 4, resolution_hours: 48}
    S3: {response_hours: 24, resolution_days: 10}
    S4: {response_hours: 72, resolution: "next scheduled release"}
  hotfix:
    allowed: true
    approval: "ops_owner + product_owner"
    retro_documentation_days: 3
  rca_required_for: [S1, S2]
  regression_test_required: true
  knowledge_base: "09.maintenance/knowledge-base.md"
