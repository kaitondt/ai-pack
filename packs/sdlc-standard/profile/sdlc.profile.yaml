# ============================================================================
#  SOFTWARE DEVELOPMENT PROJECT PROFILE
#  The single source of project-specific truth for the SDLC Skill Pack.
#  Every sdlc-* skill resolves {{profile.*}} tokens from this file.
#  Location (fixed): <repo-root>/.claude/sdlc.profile.yaml
# ============================================================================
schema_version: "1.0"

project:
  key: PRJ                       # short uppercase key, used in IDs and report names
  name: "<Project display name>"
  vendor: "<Implementation vendor>"        # revision-history "author" column
  client: "<Client / business owner org>"  # revision-history "approver" column
  copyright: "(c) {year} <Client> All rights reserved."
  start_date: "YYYY-MM-DD"
  # How the phases are sequenced. Drives how hard a gate blocks the next phase.
  #   waterfall           - one pass, gates are hard stops
  #   iterative-waterfall - the same phases per release, gates per release
  #   agile-with-gates    - sprints inside P4..P6, gates at RA / BD / ST / UAT
  delivery_model: iterative-waterfall
  # Fixed-price makes a scope change a contractual event; T&M makes it a planning
  # event. Change control is stricter under fixed-price - sdlc-change-request
  # reads this field.
  contract_type: fixed-price     # fixed-price | time-and-materials | internal
  release_cadence: "<e.g. monthly minor, quarterly major>"

# ---------------------------------------------------------------------------
# STAKEHOLDERS - who decides what. Every DEC-* names one of these as owner.
# ---------------------------------------------------------------------------
stakeholders:
  business_owner: "<name / role>"      # owns scope and priority; approves BR-*
  product_owner: "<name / role>"       # owns REQ-* and acceptance
  architect: "<name / role>"           # owns NFR-* and technical decisions
  qa_lead: "<name / role>"             # owns test strategy and quality gates
  ops_owner: "<name / role>"           # owns release, runbook, monitoring
  # Anyone else who can approve a baseline or resolve an open question.
  approvers: []

# ---------------------------------------------------------------------------
# SCOPE - what the project builds, and explicitly what it does not.
# out_of_scope entries need a reason; they are quoted into the SRS and into
# every change-request impact analysis.
# ---------------------------------------------------------------------------
scope:
  in_scope:
    - "<business capability / subsystem>"
  out_of_scope:
    - item: ""
      reason: ""
  # Systems this project must interoperate with but does not own.
  external_systems:
    - name: ""
      owner: ""
      interface: ""              # e.g. REST, SFTP file, message queue
      contract_ref: ""           # where the interface spec lives

# ---------------------------------------------------------------------------
# SYSTEM - the system being built.
# ---------------------------------------------------------------------------
system:
  root: "src"
  architecture: "<e.g. Clean Architecture, modular monolith>"
  stack:
    backend: "<e.g. .NET 9 / ASP.NET Core Web API>"
    frontend: "<e.g. React 19 + Vite + TypeScript>"
    database: "<e.g. PostgreSQL 16>"
    data_access: "<e.g. EF Core>"
    auth: "<e.g. OIDC + JWT Bearer>"
    package_manager: "<e.g. pnpm workspaces>"
    infrastructure: "<e.g. Azure App Service + Bicep>"
  # The client's (or the organisation's) own coding standards. They outrank the
  # pack's stack rules (rules/java, rules/typescript, rules/react, rules/sql)
  # wherever they differ. `digest` is the Markdown rule file /sdlc-init writes
  # from the source document, under .claude/rules/<stack>/, so the standard is
  # loaded with the code it governs instead of re-read from a PDF every task.
  # Empty list = the pack's stack rules are the standard.
  coding_standards: []
  # coding_standards:
  #   - stack: java                # java | typescript | react | sql | <other>
  #     source: "docs/_incoming/Java coding standard v2.pdf"
  #     digest: ".claude/rules/java/client-standard.md"
  #     enforced_by: "Checkstyle (config/checkstyle.xml)"   # or "" when manual only
  # Named UI surfaces. One entry per distinct device / form factor.
  surfaces:
    - id: PC
      label: "Desktop browser"
      id_suffix: "PG"            # screen IDs for this surface end with this
      viewport: "1280x800+"
    # - id: MB
    #   label: "Mobile web"
    #   id_suffix: "MG"
    #   viewport: "375x812"
  # Environments the deliverables and tests refer to by name. ST runs on a
  # production-like one; UAT runs on the environment the client accepts on.
  environments:
    - id: local
      purpose: "development"
      data: "synthetic"
    - id: test
      purpose: "UT / IT"
      data: "synthetic"
    - id: staging
      purpose: "ST"
      data: "masked production-like"
      production_like: true
    - id: uat
      purpose: "UAT"
      data: "client-prepared"
    - id: prod
      purpose: "live"
      data: "live"
  build:
    order:                       # exact build order; used by /sdlc-verify-build
      - "<step 1 command>"
      - "<step 2 command>"
    typecheck: "<command>"
    lint: "<command>"
    test_unit: "<command>"
    test_integration: "<command>"
    test_e2e: "<command>"
    # Run by hooks/format-on-edit.py after every Write/Edit of a file matching
    # `glob` (repo-relative; ** and {a,b} supported): the repository's own
    # formatter first, then its linter, on THAT file only. {file} = absolute
    # path, {rel} = path relative to cwd. Keep each command per-file and under
    # ~10s - a whole-project build here stalls every edit. blocking: true hands a
    # failing check back to be fixed; false only formats. Empty = no-op.
    on_edit: []
    # on_edit:
    #   - glob: "apps/web/src/**/*.{ts,tsx,css}"
    #     cwd: "apps/web"
    #     run: "pnpm exec prettier --write {rel}"
    #     blocking: false
    #   - glob: "apps/web/src/**/*.{ts,tsx}"
    #     cwd: "apps/web"
    #     run: "pnpm exec eslint --fix {rel}"
    #     blocking: true
    #   - glob: "apps/api/src/**/*.java"
    #     cwd: "apps/api"
    #     run: "./mvnw -q spotless:apply -DspotlessFiles={file}"
    #     blocking: false
    #     timeout: 30

# ---------------------------------------------------------------------------
# INFRASTRUCTURE - where the code lives, how it is built, and where it runs.
# Every field is a free-text or enumerated declaration: the pack does not
# assume GitHub, does not assume a cloud, and does not assume containers.
# sdlc-infrastructure resolves these into the platform's own vocabulary.
# ---------------------------------------------------------------------------
infrastructure:
  # Source control and code review. Drives where the CI definition is written,
  # what a "pull request" is called, and how the review record is captured.
  scm:
    platform: "<github | gitlab | azure-repos | bitbucket | gitea | other>"
    host: "<cloud | self-hosted>"
    remote_url: ""
    default_branch: "main"
    branching_model: "<trunk-based | git-flow | release-branch>"
    # What the platform calls a merge request, used verbatim in documents.
    review_unit: "<pull request | merge request>"
    protected_branches: ["main"]
  # Continuous integration. `definition_path` is where the pipeline file goes:
  # .github/workflows/, .gitlab-ci.yml, azure-pipelines.yml, Jenkinsfile, ...
  ci:
    platform: "<github-actions | gitlab-ci | azure-pipelines | jenkins | circleci | none>"
    definition_path: ""
    runs_on: "<hosted runner | self-hosted | both>"
    # Stages, in order. Each maps to system.build commands where one exists.
    stages: [build, typecheck, lint, test_unit, test_integration, package]
    # Gate coupling: which phase gates the pipeline asserts mechanically.
    enforces_gates: [P4_implementation]
    artifact_retention_days: 30
  cd:
    strategy: "<manual | pipeline-triggered | gitops>"
    approval_required_for: [staging, prod]
    deployment_pattern: "<rolling | blue-green | canary | recreate>"
  # Where the system runs. "on-prem" and "none" are first-class answers.
  hosting:
    provider: "<azure | aws | gcp | on-prem | hybrid | other>"
    runtime: "<vm | container | kubernetes | serverless | app-service | bare-metal>"
    regions: []
  containers:
    enabled: false
    runtime: "<docker | podman | none>"
    registry: ""
    compose_for_local: true
  iac:
    tool: "<terraform | bicep | cloudformation | pulumi | ansible | helm | none>"
    root: "infra"
    state_backend: "<remote backend, or 'n/a'>"
    # IaC is code: it is reviewed, versioned and released like the application.
    # A console change that is not reflected here is undocumented infrastructure.
    manual_changes_allowed: false
  secrets:
    store: "<platform secret store | vault | key vault | parameter store | .env (local only)>"
    rotation_policy: "<e.g. 90 days, or 'not defined'>"
  observability:
    logs: "<destination>"
    metrics: "<destination>"
    traces: "<destination, or 'none'>"
    alerting: "<channel and who receives it>"
    # Every NFR-AVAIL-* and NFR-PERF-* target needs something that measures it.
    # An NFR with no monitor is a target nobody will know was missed.
    nfr_monitors_required: true
  # Ownership. On many projects infrastructure belongs to a different team; say
  # so, because it changes what this pack may generate versus only request.
  owner: "<this project | platform team | client ops>"
  # When false, the infra agent produces proposals and reviews, never commits.
  repo_may_write_infra: true

# ---------------------------------------------------------------------------
# IDS - deterministic identifiers. Never translated, never renumbered.
# ---------------------------------------------------------------------------
ids:
  module_pattern: "^[A-Z]{2}[0-9]{4}(PG|MG|BT)$"   # e.g. SL0030PG
  module_example: "SL0030PG"
  doc_id_format: "{MODULE}-{TYPE}-{NNN}"
  types:
    screen: SC
    function: FC
    api: API
    data: DT
    batch: BT
    report: RP
    file: FL
    detail: DD
  business_requirement_id_format: "BR-{AREA}-{NNN}"
  requirement_id_format: "REQ-{AREA}-{NNN}"
  nfr_id_format: "NFR-{CATEGORY}-{NNN}"    # CATEGORY: PERF SEC AVAIL OPS USE COMPL
  assumption_id_format: "ASM-{NNN}"
  decision_id_format: "DEC-{NNN}"
  risk_id_format: "RSK-{NNN}"
  message_id_format: "MSG-{MODULE_BASE}-{NNN}"
  test_id_format:
    unit: "UT-{MODULE}-{NNN}"
    integration: "IT-{FLOW}-{NNN}"
    system: "ST-{SCENARIO}-{NNN}"
    acceptance: "UAT-{NNN}"
  defect_id_format: "BUG-{NNN}"
  incident_id_format: "INC-{YYYY}-{NNN}"
  number_width: 3                # NNN -> 3 digits, zero padded

# ---------------------------------------------------------------------------
# PATHS - where deliverables live. Directory names may be localised.
# ---------------------------------------------------------------------------
paths:
  docs_root: "docs"
  inception: "docs/00.inception"       # scope, stakeholders, glossary, decisions
  requirements: "docs/01.requirements"
  design_root: "docs/02.basic-design"
  detail_design: "docs/03.detail-design"
  test_design: "docs/04.test-design"
  reviews: "docs/08.reviews"
  drift_reports: "docs/05.drift"          # DD <-> code divergence reports
  uat: "docs/09.uat"
  maintenance: "docs/10.maintenance"
  change_requests: "docs/11.change-requests"
  bug_traces: "docs/12.bug-trace"              # per-bug traceability dossiers + bug-trace-register.csv
  traceability: "docs/traceability.csv"
  decision_log: "docs/00.inception/decision-log.md"
  assumption_log: "docs/00.inception/assumption-log.md"
  risk_register: "docs/00.inception/risk-register.md"
  glossary: "docs/00.inception/glossary.md"
  metrics: "docs/06.metrics"
  runbook: "docs/07.operations/runbook.md"
  # Basic-design categories, in generation order. Rename freely per project.
  bd_categories:
    - key: architecture
      dir: "01.architecture"
      skill: sdlc-basic-design
    - key: nfr
      dir: "02.non-functional"
      skill: sdlc-nfr-design
    - key: screen
      dir: "03.screen-design"
      skill: sdlc-screen-design
    - key: function
      dir: "04.function-design"
      skill: sdlc-function-design
    - key: data
      dir: "05.data-design"
      skill: sdlc-data-design
    - key: interface
      dir: "06.interface-design"
      skill: sdlc-api-design
    - key: report
      dir: "07.report-design"
      skill: sdlc-basic-design
    - key: batch
      dir: "08.batch-design"
      skill: sdlc-batch-design

# ---------------------------------------------------------------------------
# LANGUAGE - deliverable language is fixed per directory, never mixed.
# ---------------------------------------------------------------------------
language:
  primary: en                    # language of the authoritative deliverables
  working: en                    # language the team converses in
  by_path:
    - path: "docs/**"
      lang: en
  immutable_tokens:
    - "module IDs"
    - "document IDs"
    - "requirement IDs"
    - "MSG-IDs"
    - "table and column names"
    - "API paths and field names"
    - "file paths and URLs"
    - "code blocks"
  dictionary: ""                 # optional path to a term dictionary CSV
  grammar_fixes: ""              # optional path to a phrasing-correction CSV
  # Every correction the client's reviewers make to a translated deliverable,
  # appended as it arrives (TL-10). Read before translating or reviewing a
  # translation, so the same correction is never needed twice.
  correction_log: ""             # e.g. docs/00.inception/translation-corrections.csv

# ---------------------------------------------------------------------------
# DOCUMENT STANDARD - shared skeleton for every generated deliverable.
# ---------------------------------------------------------------------------
document:
  revision_table_headers: ["Version", "Date", "Change", "Author", "Reviewer", "Approver", "Approved on"]
  initial_version: "0.1.0"       # pre-baseline drafts are 0.x
  baseline_version: "1.0.0"      # the version a document takes when baselined
  initial_change_text: "Initial draft"
  auto_version_bump: false       # MUST stay false - bump only on explicit instruction
  date_format: "YYYY/MM/DD"
  diagram_tool: mermaid
  diagram_constraints:
    - "flowchart TD only for processing flows"
    - "no shapes newer than the renderer in use"
  require_review_record: true    # every deliverable carries a review-record section
  footer: "{{profile.project.copyright}}"

# ---------------------------------------------------------------------------
# TEMPLATES - the client's own deliverable forms. The pack ships NONE: every
# organisation has its own, in its own format, and a template invented here
# is rejected at the first review.
#
# Collected by /sdlc-init and maintained by /sdlc-template-register.
# Read by sdlc-document-io, which owns the read/write mechanics per format.
# ---------------------------------------------------------------------------
templates:
  root: "docs/templates"
  # What to do when a category has no registered template.
  #   ask      - stop and ask the user for one (default; safest)
  #   skeleton - generate from the category skill's own section list, and say so
  #   block    - refuse to generate the category at all
  on_missing: ask
  # Formats the agents may read and write. A format listed here must have a
  # working toolchain - /sdlc-profile-check verifies each one.
  formats_enabled: [md, xlsx, docx, csv]
  # Per-category registration. `key` matches a paths.bd_categories[].key, or one
  # of: requirements, detail, test_ut, test_it, test_st, test_uat, review,
  # cr_report, incident, gate_record, release_note, bug_list.
  # Empty at init; /sdlc-init appends one entry per template the user provides.
  registry:
    - key: ""
      path: ""                   # repo-relative, under templates.root
      format: ""                 # md | xlsx | docx | csv
      output_format: ""          # "" = same as the template's own format
      # Which copy is the source of truth once reviewers start editing (DIO-09).
      # "" = the generated working form; "xlsx" / "docx" = reviewers edit the
      # delivered file and it is imported back, never overwritten by a regeneration.
      authority: ""
      # xlsx only: which sheet carries the deliverable, and where the repeating
      # rows start. Both are read from the template itself when left empty.
      sheet: ""
      header_rows: 0
      # Cells or headings the generator must fill, named as the template names
      # them. Left empty, sdlc-document-io derives them from the placeholders
      # it finds in the file.
      fields: []
      status: none               # provided | none
  # A template is authoritative over the category skill's section list. Where
  # they disagree the template wins and the difference is reported - never
  # silently resolved. See rules/sdlc/document-standards.md DS-11.
  template_wins_over_skill: true
  # Round-trip fidelity: when a deliverable is written into a copy of the
  # client's own file, nothing outside the filled fields may change.
  preserve_unfilled_structure: true

# ---------------------------------------------------------------------------
# MOCKUP - the visual counterpart of the screen design. What form it takes is a
# project decision: an HTML prototype, an AI-generated design canvas, a Figma
# file the client already owns, or exported images. The pack reads, creates and
# edits each; it does not assume one.
#
# A mockup is never the specification. The screen design is (MU-01).
# ---------------------------------------------------------------------------
mockup:
  enabled: true
  # html    - self-contained HTML/CSS prototype in the repository
  # canvas  - Claude Design canvas artboards (.dc.html), published as an Artifact
  # figma   - the design lives in Figma; the repo holds the reference and the export
  # image   - PNG/PDF exports from any tool, committed as files
  # none    - no mockup deliverable on this project
  kind: html
  dir: "docs/02.basic-design/09.mockup"
  surfaces: [PC]                 # which system.surfaces[] entries get mockups
  naming: "{MODULE}_{screen name}"
  html:
    self_contained: true         # inline CSS/JS; no CDN, no build step
    shared_assets: "_assets"     # shared stylesheet / script directory, if any
    viewport_per_surface: true   # honour system.surfaces[].viewport
  figma:
    file_url: ""                 # the file the client maintains
    access: "<view link | MCP connector | manual export>"
    export_dir: "docs/02.basic-design/09.mockup/_export"
    # Figma is read-only from here unless the client says otherwise: the design
    # team owns the file, and an edit made from a build tool is invisible to them.
    writable: false
  canvas:
    artifact_url: ""             # set once published; reused on every update
  states_required: [normal, empty, loading, error, no-permission]
  # A mockup that disagrees with its screen design is a Critical finding (X-11).
  # Neither side is edited to match the other without deciding against the SRS.
  cross_check_with_screen_design: true

# ---------------------------------------------------------------------------
# QUALITY GATES - entry and exit criteria per phase. A phase may not be
# declared complete until every exit assertion holds.
# ---------------------------------------------------------------------------
gates:
  P0_inception:
    entry: ["a named business owner exists"]
    exit:
      - "scope in/out documented, every out-of-scope item has a reason"
      - "stakeholder map, glossary, decision log and risk register exist"
      - "every BR-* has an owner and a priority"
  P1_requirements:
    entry: ["P0 exit holds"]
    exit:
      - "every REQ-* traces to a BR-* and is testable"
      - "every NFR-* states a measurable target and a measurement method"
      - "no requirement left in TBD; open questions have owners and due dates"
      - "SRS reviewed and baselined by the product owner"
  P2_basic_design:
    entry: ["SRS baselined"]
    exit:
      - "/sdlc-review-design reports zero Critical findings"
      - "SC / FC / API / DT cross-checks pass"
      - "every REQ-* is realised by at least one design item"
  P3_detail_design:
    entry: ["basic design baselined for the module"]
    exit:
      - "every FC has a DD, or an explicit 'no detail design needed' decision"
      - "the UT case basis is derivable from the DD"
  P4_implementation:
    entry: ["DD approved for the module"]
    exit:
      - "/sdlc-verify-build passes"
      - "/sdlc-review-commit reports zero Critical findings"
      - "unit tests for the module pass"
  P5_unit_test:
    entry: ["code complete for the module"]
    exit:
      - "every DD processing rule has at least one UT case"
      - "UT pass rate 100%, or every open defect classified and accepted"
      - "coverage meets {{profile.quality.targets.unit_coverage}}"
  P6_integration_test:
    entry: ["UT exit holds for every module in the flow"]
    exit:
      - "every interface and every screen flow has at least one IT case"
      - "no open Critical or High defect"
  P7_system_test:
    entry: ["IT exit holds; staging deployed from a release build"]
    exit:
      - "every REQ-* and every NFR-* has an executed ST case"
      - "no open Critical or High defect"
      - "NFR measurements recorded with their measurement method"
  P8_uat:
    entry: ["ST exit holds; UAT environment and data ready; UAT plan signed"]
    exit:
      - "every UAT scenario executed with a recorded verdict"
      - "every UAT defect closed, deferred with approval, or accepted"
      - "acceptance recorded with approver and date"
  P9_maintenance:
    entry: ["release accepted; runbook and handover complete"]
    exit:
      - "every incident has a class, a root cause and a closure record"
      - "every recurring incident has a preventive action or an accepted risk"
  CR_change_request:
    - "the chosen option and its approver are recorded in the report"
    - "every impact-matrix row marked required is done or deferred with a reason"
    - "design documents were updated before code"
    - "traceability rows for CR-sourced behaviour cite the CR id"

# ---------------------------------------------------------------------------
# REVIEW - which checklist families apply. Turn off what you do not use.
# ---------------------------------------------------------------------------
review:
  families:
    common: true                 # C01..   document hygiene
    requirement: true            # RQ01..
    screen: true                 # SD01..
    function: true               # FD01..
    api: true                    # API01..
    data: true                   # DT01..
    nfr: true                    # NF01..
    batch: false                 # BT01..
    report: false                # RP01..
  severity_levels: ["Critical", "Warning", "Suggestion"]
  record_in_document: true       # the review record lives in the document itself
  output_dir: "{{profile.paths.reviews}}"

# ---------------------------------------------------------------------------
# QUALITY - metrics, targets and the defect model. Read by sdlc-quality-metrics
# and /sdlc-quality-report. Targets are project agreements, not universal truths:
# set them from your own history, then hold them.
# ---------------------------------------------------------------------------
quality:
  size_unit: KLOC                # KLOC | function-point | screen | story-point
  targets:
    review_density: ">= 2 findings per design document"
    design_defect_density: "0.5 - 2.0 per document"
    code_defect_density: "1 - 5 per KLOC"
    test_density: ">= 15 UT cases per KLOC"
    unit_coverage: "line >= 70%, branch >= 60%"
    phase_containment: ">= 80% of defects found in the phase that injected them"
    ut_pass_rate: "100% before IT entry"
    escaped_defects: "< 5% of all defects first found in UAT"
  severity:
    - id: S1
      label: "Critical"
      definition: "system unusable, data loss, or no workaround"
    - id: S2
      label: "High"
      definition: "major function unusable, workaround is costly"
    - id: S3
      label: "Medium"
      definition: "function impaired, acceptable workaround exists"
    - id: S4
      label: "Low"
      definition: "cosmetic or minor inconvenience"
  # A defect is attributed to the phase that INJECTED it, not the phase that
  # found it. Phase containment is meaningless unless this stays honest.
  injection_phases: [P1, P2, P3, P4, P5, P6, P7, P8]
  metrics_report: "{{profile.paths.metrics}}/quality-report.md"

# ---------------------------------------------------------------------------
# CONSTRAINTS - hard project rules enforced by hooks and skills.
# ---------------------------------------------------------------------------
constraints:
  baseline_change_requires_cr: true    # a baselined document changes only via a CR
  production_change_via_release_only: true
  db_schema_owner: "this project"      # "this project" | "<other team>" | "frozen"
  secrets_policy: "never commit secrets; .env.example documents the required keys"
  generated_files_glob: "**/*.generated.*"
  # Absolute-deny edit paths. Enforced by hooks/guard-protected-paths.py.
  readonly_globs:
    - "**/*.generated.*"
    - "docs/**/_baselined/**"
  # Documents that are baselined. Editing one requires an approved CR.
  # Appended by /sdlc-phase-gate when a gate passes.
  baselined:
    - path: ""
      version: ""
      approved_on: ""
      cr_required: true

# ---------------------------------------------------------------------------
# PROJECT RULES - the project's own rules, on top of the pack's.
# Files live under .claude/rules/project/ (the pack never writes there, so a
# plugin update or re-init leaves them alone). Maintained by /sdlc-rule-register.
# Order of authority: pack invariants (rules/sdlc/*, security non-negotiables) >
# client coding standard (system.coding_standards) > project rules > pack stack
# and common rules. A project rule may tighten an invariant, never relax it.
# ---------------------------------------------------------------------------
project_rules: []
  # project_rules:
  #   - id: PRJ-NAMING                     # topic id; rule ids are PRJ-NAMING-01...
  #     file: ".claude/rules/project/naming.md"
  #     kind: coding                       # coding | naming | architecture | security |
  #                                        # document | process | testing | other
  #     scope: ["src/**/*.ts"]             # same globs as the file's paths:, or ["*"]
  #     source: "DEC-044"                  # DEC-*, a document path, or ""
  #     overrides: []                      # pack stack/common rule ids, e.g. [TS-07]
  #     enforced_by: ""                    # tool/config, or "" when review only
  #     status: active                     # active | retired

# ---------------------------------------------------------------------------
# EXECUTION - which model the delegated agents run on.
# Applied to .claude/agents/*.md frontmatter by /sdlc-init.
# ---------------------------------------------------------------------------
execution:
  # Model and effort profile for the sdlc-* agents. Each agent is in one tier:
  #   heavy    - analysis, design, review, triage: silent failure modes that
  #              only surface at review, UAT or the steering committee.
  #   standard - production work from an approved document (code, tests,
  #              infra, mockups, reports), checked by build, tests and review.
  # quality  : heavy opus xhigh,   standard opus high
  # balanced : heavy opus high,    standard sonnet medium   (pack default)
  # budget   : heavy sonnet high,  standard sonnet medium
  # The tier of every agent is listed in PROFILE-SCHEMA.md, "execution".
  model_profile: balanced
  agent_model_overrides: {}        # per-agent, wins over the profile
  agent_effort_overrides: {}       # per-agent effort: low | medium | high | xhigh | max
  # Effort for your own session, where the commands run. Agents take theirs
  # from model_profile; the session level is set with /effort, not from here.
  intended_effort: "xhigh"

# ---------------------------------------------------------------------------
# TESTING - P5..P8 artifacts, pipeline shape, automation and evidence.
# ---------------------------------------------------------------------------
testing:
  paths:
    testcase_root: "test/cases"        # one sub-folder per module / flow / scenario
    step_subdir: "Step"                # intermediate checkpoint files
    it_plan: "test/it-plan"
    st_plan: "test/st-plan"
    uat_plan: "docs/09.uat/plan"
    automation_root: "test/automation"
    evidence_root: "test/evidence"
    results_root: "test/results"
  naming:
    module_dir: "UT_{BATCH}_{MODULE}"
    ut_file: "UT_{BATCH}_{MODULE}_{TS}.md"
    it_file: "IT_{FLOW}_{TS}.md"
    st_file: "ST_{SCENARIO}_{TS}.md"
    uat_file: "UAT_{SCENARIO}_{TS}.md"
    timestamp: "YYYYMMDD_HHmmss"
    batches: ["Pilot", "Batch1", "Batch2", "Batch3"]
  # The V-model binding: which specification each level verifies. A level whose
  # basis document is not baselined cannot have its cases finalised.
  levels:
    - id: UT
      phase: P5
      basis: detail_design
      environment: test
      owner: developer
    - id: IT
      phase: P6
      basis: design_root
      environment: test
      owner: developer
    - id: ST
      phase: P7
      basis: requirements
      environment: staging
      owner: qa_lead
    - id: UAT
      phase: P8
      basis: requirements
      environment: uat
      owner: business_owner
  pipeline:
    human_pauses: ["after_qna", "after_checklist"]
    keep_retry_history: true
    max_review_rounds: 3
  viewpoints:                          # disable one only when it cannot apply
    - VP-01  # happy path
    - VP-02  # empty / no result
    - VP-03  # validation (field state, input, output, error)
    - VP-04  # authentication and session
    - VP-05  # repeated or concurrent submission
    - VP-06  # server / network / dependency failure
    - VP-07  # cross-module navigation and state carry-over
    - VP-08  # permission and role
    - VP-09  # layout, rendering and responsive integrity
    - VP-10  # data hazards (rounding, precision, dates, time zone, collation)
  system_test:
    scenario_source: "business process end to end, not screen by screen"
    nfr_in_scope: true
    includes: ["regression", "performance", "security", "failover", "data volume", "operability"]
  uat:
    executed_by: client
    support_model: "vendor on standby, defects triaged same day"
    entry_signoff_required: true
    defect_sla_hours: {S1: 4, S2: 24, S3: 72, S4: "next release"}
  automation:
    framework: "<e.g. Playwright + TypeScript>"
    layout:
      specs: "tests/{module}"
      page_objects: "src/pages"
      data: "src/data"
      fixtures: "src/fixtures"
      db_client: "src/db"
    spec_naming: "{module}.flow{N}.spec.ts"
    data_driven: true
    results_format: "<e.g. allure>"
    # The runner's own listing of the tests it would execute, one per line. It
    # is how scripts are counted and reconciled 1:1 against the manual cases -
    # never grep, which misses loop-generated and parameterised tests.
    list_command: "<e.g. npx playwright test --list | pytest --collect-only -q>"
    # Where a test names the manual case it implements: title prefix, tag or
    # annotation. Used for the reconciliation; one TC ID per test.
    tc_id_in: title              # title | tag | annotation
  evidence:
    naming: "{TC_ID}_{seq}"
    formats: ["png", "csv", "log"]
    required_for: ["ST", "UAT"]
  rounds:
    count: 2
    columns: ["date", "tester", "result", "note"]

# ---------------------------------------------------------------------------
# CHANGE REQUEST - changes to a baselined artifact. Cross-cutting: a CR can
# arrive in any phase from P1 onward.
# ---------------------------------------------------------------------------
change_request:
  id_format: "CR-{NNN}"
  id_source: client              # client | project. Whoever owns the CR list.
  min_options: 2                 # options phase 2 must present before the first gate
  gates: ["after_options", "after_design"]
  require_estimate: true         # effort and schedule impact stated before approval
  cascade:
    - requirements
    - nfr
    - data
    - screen
    - function
    - interface
    - detail
    - mockup
    - report
    - batch
    - indexes                    # catalogue / "list of ..." documents
    - translations               # counterpart-language directories
    - test_cases
  update_test_cases: true
  classes: [CR-SCOPE, CR-UI, CR-FIELD, CR-LOGIC, CR-MESSAGE, CR-REPORT, CR-DATA,
            CR-NFR, CR-NEW, CR-REMOVE, CR-CLARIFY, CR-OUT-OF-SCOPE]

# ---------------------------------------------------------------------------
# MAINTENANCE - P9. Incident handling after acceptance.
# ---------------------------------------------------------------------------
maintenance:
  support_window: "<e.g. Mon-Fri 09:00-18:00 JST>"
  warranty_period: "<e.g. 3 months after acceptance>"
  classes: [INC-DEFECT, INC-DATA, INC-ENV, INC-USAGE, INC-ENHANCEMENT, INC-EXTERNAL]
  # Response = acknowledged and triaged. Resolution = fix released, or an
  # accepted workaround in place with a scheduled fix.
  sla:
    S1: {response_hours: 1, resolution_hours: 8}
    S2: {response_hours: 4, resolution_hours: 48}
    S3: {response_hours: 24, resolution_days: 10}
    S4: {response_hours: 72, resolution: "next scheduled release"}
  hotfix:
    allowed: true
    approval: "ops_owner + product_owner"
    # A hotfix skips the queue, never the record. Documents and tests are brought
    # back in line within this window, or the change is treated as unrecorded.
    retro_documentation_days: 5
  rca_required_for: [S1, S2]
  regression_test_required: true   # every fix adds the case that would have caught it
  knowledge_base: "{{profile.paths.maintenance}}/knowledge-base.md"

# ---------------------------------------------------------------------------
# BUG TRACE - cross-phase bug traceability (sdlc-bug-trace, /sdlc-trace-bug).
# Every key is optional: absent or empty means "detect from the repository".
# ---------------------------------------------------------------------------
bug_trace:
  mainline: ""                   # branch releases are cut from; "" = the branch origin/HEAD points to
  release_tag_pattern: ""        # glob for tags that are releases, e.g. "v*"; "" = every tag
  commit_ref_patterns: []        # extra regexes for ticket keys in commit messages, e.g. "PRJ-[0-9]+"
