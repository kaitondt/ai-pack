# ============================================================================
#  MIGRATION PROJECT PROFILE
#  The single source of project-specific truth for the Migration Skill Pack.
#  Every mig_* skill resolves {{profile.*}} tokens from this file.
#  Location (fixed): <repo-root>/.claude/migration.profile.yaml
# ============================================================================
schema_version: "1.0"

project:
  key: MIG                       # short uppercase key, used in IDs and report names
  name: "<Project display name>"
  vendor: "<Implementation vendor>"      # revision-history "author" column
  client: "<Client company>"             # revision-history "approver" column
  copyright: "(c) {year} <Client> All rights reserved."
  start_date: "YYYY-MM-DD"

# ---------------------------------------------------------------------------
# LEGACY - the system being migrated FROM. Read-only, always.
# ---------------------------------------------------------------------------
legacy:
  kind: vbnet                    # vbnet | cobol | delphi | php | java-ee | powerbuilder | access | other
  root: "src/legacy"             # repo-relative
  ui_source: "src/legacy/<App>/Forms"        # where screen definitions live
  logic_source: "src/legacy/<App>/Business"
  db_source: "src/legacy/procedure"          # stored procedures / DDL
  readonly: true                 # NEVER set false. Guards and hooks depend on it.
  screen_capture_dir: "docs/legacy-captures" # optional screenshots of the old UI
  # Artifacts whose behaviour must NOT be reproduced (obsolete / dead code).
  # Each entry needs a reason; used by /mig_analyze_legacy to scope out.
  excluded:
    - id: ""
      reason: ""

# ---------------------------------------------------------------------------
# TARGET - the system being migrated TO.
# ---------------------------------------------------------------------------
target:
  root: "src/app"
  architecture: "Clean Architecture"        # free text, quoted in the TSD
  stack:
    backend: "<e.g. .NET 9 / ASP.NET Core Web API>"
    frontend: "<e.g. React 19 + Vite + TypeScript>"
    database: "<e.g. SQL Server, pre-existing schema>"
    data_access: "<e.g. Dapper over stored procedures>"
    auth: "<e.g. JWT Bearer>"
    package_manager: "<e.g. pnpm workspaces>"
  # Named UI surfaces. One entry per distinct device / form factor.
  surfaces:
    - id: PC
      label: "Desktop browser"
      id_suffix: "PG"            # screen IDs for this surface end with this
      viewport: "1280x800+"
    # - id: HH
    #   label: "Handheld terminal"
    #   id_suffix: "HG"
    #   viewport: "320x534"
  # Named environments the deliverables, tests and cutover plan refer to.
  # A migration has two that a greenfield project does not: the legacy system
  # still running in production, and the parallel-run environment where old and
  # new are compared against the same input.
  environments:
    - id: local
      purpose: "development"
      data: "synthetic"
    - id: test
      purpose: "UT / IT"
      data: "masked copy of legacy production"
    - id: parallel
      purpose: "parallel run - legacy and target on the same input, outputs compared"
      data: "live copy, refreshed per run"
      production_like: true
    - id: uat
      purpose: "UAT"
      data: "client-prepared"
    - id: prod
      purpose: "live"
      data: "live"
    # The legacy production system. Listed so documents can name it; NEVER a
    # deployment target for this project.
    - id: legacy-prod
      purpose: "the system being migrated from"
      data: "live"
      readonly: true
  build:
    order:                       # exact build order; used by /mig_verify_build
      - "<step 1 command>"
      - "<step 2 command>"
    typecheck: "<command>"
    test_unit: "<command>"
    test_e2e: "<command>"

# ---------------------------------------------------------------------------
# INFRASTRUCTURE - where the TARGET code lives, how it is built, where it runs,
# and how it takes over from the legacy system. Every field is declared: the
# pack does not assume GitHub, does not assume a cloud, does not assume
# containers. mig_infrastructure resolves these into the platform's vocabulary.
#
# The legacy system's own infrastructure is READ-ONLY, like its source (LR-01).
# Nothing here is a licence to change it.
# ---------------------------------------------------------------------------
infrastructure:
  scm:
    platform: "<github | gitlab | azure-repos | bitbucket | gitea | other>"
    host: "<cloud | self-hosted>"
    remote_url: ""
    default_branch: "main"
    branching_model: "<trunk-based | git-flow | release-branch>"
    review_unit: "<pull request | merge request>"
    protected_branches: ["main"]
  ci:
    platform: "<github-actions | gitlab-ci | azure-pipelines | jenkins | circleci | none>"
    definition_path: ""
    runs_on: "<hosted runner | self-hosted | both>"
    stages: [build, typecheck, lint, test_unit, test_integration, package]
    enforces_gates: [P4_implementation]
    artifact_retention_days: 30
  cd:
    strategy: "<manual | pipeline-triggered | gitops>"
    approval_required_for: [uat, prod]
    deployment_pattern: "<rolling | blue-green | canary | recreate>"
  hosting:
    provider: "<azure | aws | gcp | on-prem | hybrid | other>"
    runtime: "<vm | container | kubernetes | serverless | app-service | bare-metal>"
    regions: []
  containers:
    enabled: false
    runtime: "<docker | podman | none>"
    registry: ""
    compose_for_local: true
  iac:
    tool: "<terraform | bicep | cloudformation | pulumi | ansible | helm | none>"
    root: "infra"
    state_backend: "<remote backend, or 'n/a'>"
    manual_changes_allowed: false
  secrets:
    store: "<platform secret store | vault | key vault | parameter store | .env (local only)>"
    rotation_policy: "<e.g. 90 days, or 'not defined'>"
  observability:
    logs: "<destination>"
    metrics: "<destination>"
    traces: "<destination, or 'none'>"
    alerting: "<channel and who receives it>"

  # -------------------------------------------------------------------------
  # COEXISTENCE - the part a greenfield project does not have. During cutover
  # the legacy system and the target run at the same time, over data that must
  # not diverge. These fields drive the cutover plan and the parallel run.
  # -------------------------------------------------------------------------
  coexistence:
    # big-bang    - one switch, one date, everything moves
    # phased      - module by module or site by site, both live for a period
    # strangler   - a router sends named routes to the target, the rest to legacy
    # parallel    - both process the same input; only one is authoritative
    strategy: "<big-bang | phased | strangler | parallel>"
    duration: "<how long both systems are live, or 'n/a' for big-bang>"
    # Which system owns the data while both are running. Two writers over one
    # database is the defect class that ends migrations.
    system_of_record: "<legacy | target | per-module>"
    # Only when both write. State the conflict rule or say there is none.
    dual_write: false
    conflict_resolution: ""
    router: "<what routes a user or a request to one system or the other>"
    # Users see two systems during coexistence. Say how they know which is which.
    user_routing: ""
  data_migration:
    tool: "<ETL tool, scripts, or 'manual'>"
    root: "migration-scripts"
    # A migration run is judged on reconciliation, not on completing without error.
    reconciliation_required: true
    reconciliation: ["row counts per table", "control totals on money and quantity columns",
                     "referential integrity", "spot-check of known records"]
    rehearsals_required: 2       # on a production-sized copy, timed
    cutover_window: "<hours available, and what the business does meanwhile>"
    # The point after which rollback means losing data entered in the target.
    point_of_no_return: ""
  parallel_run:
    enabled: true
    # The migration's strongest verification tool: same input to both systems,
    # outputs compared field by field. Read by mig_test_it and the cutover plan.
    environment: parallel
    compare: ["screen output", "report output", "batch output files", "database state"]
    tolerance: "exact"           # "exact", or the named fields allowed to differ and why
    duration: "<how many cycles / days>"
    sign_off_by: "<role>"
  rollback:
    # In a migration, rollback usually means going BACK to the legacy system,
    # which is a different problem from redeploying a previous build.
    target: "<legacy | previous target release | both>"
    data_strategy: "<what happens to records created in the target after cutover>"
    rehearsed: false             # G6 asks for evidence, not intent
    decision_owner: "<who calls it, and by when>"

  owner: "<this project | platform team | client ops>"
  repo_may_write_infra: true
  # The legacy system's infrastructure, named so documents can refer to it.
  # Always read-only from this project (LR-01).
  legacy_infrastructure: "<where the legacy system runs, for reference only>"

# ---------------------------------------------------------------------------
# IDS - deterministic identifiers. Never translated, never renumbered.
# ---------------------------------------------------------------------------
ids:
  module_pattern: "^[A-Z]{2}[0-9]{4}(PG|HG|BT)$"   # e.g. KK0030PG
  module_example: "KK0030PG"
  doc_id_format: "{MODULE}-{TYPE}-{NNN}"
  types:
    screen: SC
    function: FC
    api: API
    batch: BT
    report: RP
    file: FL
    detail: DD
  message_id_format: "MSG-{MODULE_BASE}-{NNN}"     # MODULE_BASE = module minus surface suffix
  requirement_id_format: "REQ-{AREA}-{NNN}"
  legacy_id_format: "LEG-{AREA}-{NNN}"
  test_id_format:
    unit: "UT-{MODULE}-{NNN}"
    integration: "IT-{MODULE}-{NNN}"
    uat: "UAT-{NNN}"
  number_width: 3                # NNN -> 3 digits, zero padded

# ---------------------------------------------------------------------------
# PATHS - where deliverables live. Directory names may be localised.
# ---------------------------------------------------------------------------
paths:
  docs_root: "docs"
  requirements: "docs/requirements"
  design_root: "docs/design"
  detail_design: "docs/detail-design"
  test_design: "docs/test-design"
  reviews: "docs/reviews"
  gap_reports: "docs/gap"
  uat_reports: "uat-bug"
  change_requests: "change-requests"
  bug_traces: "bug-trace"          # per-bug traceability dossiers + bug-trace-register.csv
  traceability: "docs/traceability.csv"
  # Basic-design categories, in generation order. Rename freely per project.
  bd_categories:
    - key: architecture
      dir: "01.architecture"
      skill: mig_basic_design
    - key: screen
      dir: "02.screen-design"
      skill: mig_screen_design
    - key: function
      dir: "03.function-design"
      skill: mig_function_design
    - key: data
      dir: "04.data-design"
      skill: mig_data_design
    - key: interface
      dir: "05.interface-design"
      skill: mig_api_design
    - key: report
      dir: "06.report-design"
      skill: mig_basic_design
    - key: file
      dir: "07.file-design"
      skill: mig_basic_design
    - key: batch
      dir: "08.batch-design"
      skill: mig_batch_design

# ---------------------------------------------------------------------------
# LANGUAGE - deliverable language is fixed per directory, never mixed.
# ---------------------------------------------------------------------------
language:
  primary: en                    # language of the authoritative deliverables
  working: en                    # language the team converses in
  by_path:
    - path: "docs/**"
      lang: en
  # Tokens that are NEVER translated, in any direction.
  immutable_tokens:
    - "module IDs"
    - "document IDs"
    - "MSG-IDs"
    - "table and column names"
    - "stored-procedure names"
    - "file paths and URLs"
    - "code blocks"
  dictionary: ""                 # optional path to a term dictionary CSV
  grammar_fixes: ""              # optional path to a phrasing-correction CSV

# ---------------------------------------------------------------------------
# DOCUMENT STANDARD - shared skeleton for every generated deliverable.
# ---------------------------------------------------------------------------
document:
  revision_table_headers: ["Version", "Date", "Change", "Author", "Approver", "Approved on"]
  initial_version: "1.0.0"
  initial_change_text: "Initial version"
  auto_version_bump: false       # MUST stay false - bump only on explicit instruction
  date_format: "YYYY/MM/DD"
  diagram_tool: mermaid
  diagram_constraints:
    - "flowchart TD only for processing flows"
    - "no shapes newer than the renderer in use"
  footer: "{{profile.project.copyright}}"

# ---------------------------------------------------------------------------
# TEMPLATES - the client's own deliverable forms. The pack ships NONE: every
# organisation has its own, in its own format, and a template invented here is
# rejected at the first review - after a whole category has been written into it.
#
# Collected by /mig_init, maintained by /mig_template_register, used by
# mig_document_io. Distinct from legacy documents, which are read-only INPUTS
# and are never authoritative about behaviour (DIO-08).
# ---------------------------------------------------------------------------
templates:
  root: "docs/templates"
  # ask      - stop and ask for the form (default; safest)
  # skeleton - generate from the category skill's own section list, and say so
  # block    - refuse to generate the category at all
  on_missing: ask
  formats_enabled: [md, xlsx, docx, csv]
  # Per-category registration. `key` matches a paths.bd_categories[].key, or one
  # of: requirements, detail, test_ut, test_it, test_uat, review, cr_report,
  # uat_report, legacy_inventory.
  # Empty at init; /mig_init appends one entry per form the client supplies.
  registry:
    - key: ""
      path: ""                   # repo-relative, under templates.root
      format: ""                 # md | xlsx | docx | csv
      output_format: ""          # "" = same as the template's own format
      sheet: ""                  # xlsx only; read from the file when empty
      header_rows: 0
      fields: []                 # derived from the form's placeholders when empty
      status: none               # provided | none
  template_wins_over_skill: true
  preserve_unfilled_structure: true
  # Legacy documents (old design specs, operator manuals, handover packs) are
  # read-only inputs, kept apart from the client's blank forms so nobody writes
  # into one. They are evidence of INTENT; the legacy code is the evidence of
  # BEHAVIOUR (DIO-08).
  legacy_documents_dir: "docs/legacy-documents"

# ---------------------------------------------------------------------------
# MOCKUP - the visual counterpart of the screen design. In a migration the
# legacy screen is the oracle: a mockup reproduces it unless a recorded client
# decision says otherwise (NI-02 applies to pixels as much as to rules).
#
# A mockup is never the specification. The screen design is (MU-01).
# ---------------------------------------------------------------------------
mockup:
  enabled: true
  # html    - self-contained HTML/CSS prototype in the repository
  # canvas  - Claude Design canvas artboards (.dc.html), published as an Artifact
  # figma   - the design lives in Figma; the repo holds the reference and the export
  # image   - PNG/PDF exports from any tool, committed as files
  # none    - no mockup deliverable on this project
  kind: html
  dir: "docs/design/09.mockup"
  surfaces: [PC]                 # which target.surfaces[] entries get mockups
  naming: "{MODULE}_{screen name}"
  # HOW FAITHFUL TO THE LEGACY SCREEN. The field that decides whether a UI
  # difference is a defect or a deliverable.
  #   as-is      - reproduce the legacy layout: same fields, same order, same
  #                grouping, same tab order. Restyling is limited to the target
  #                platform's own controls.
  #   restyled   - same information and same order, modern visual language.
  #                Layout changes need a recorded decision per screen.
  #   redesigned - the UI is deliberately re-thought. Requires a funded, written
  #                client decision; the legacy is then no longer the UI oracle,
  #                only the behaviour oracle.
  fidelity: as-is
  # Screens the client has agreed to treat differently from `fidelity`.
  # Each needs the decision that authorised it - an exception with no decision
  # is an invention (NI-02).
  fidelity_exceptions:
    - module: ""
      fidelity: ""
      decision: ""               # written client decision, with date
  html:
    self_contained: true         # inline CSS/JS; no CDN, no build step
    shared_assets: "_assets"
    viewport_per_surface: true   # honour target.surfaces[].viewport
  figma:
    file_url: ""
    access: "<view link | MCP connector | manual export>"
    export_dir: "docs/design/09.mockup/_export"
    writable: false              # the design team owns the file
  canvas:
    artifact_url: ""             # set once published; reused on every update
  states_required: [normal, empty, loading, error, no-permission]
  # X-09 mockup <-> screen design; X-10 mockup <-> legacy capture.
  cross_check_with_screen_design: true
  cross_check_with_legacy: true

# ---------------------------------------------------------------------------
# QUALITY GATES - a phase may not be declared complete until its gate passes.
# ---------------------------------------------------------------------------
gates:
  P0_legacy_analysis:
    - "every in-scope legacy artifact has a LEG-* id"
    - "excluded artifacts each carry a reason"
  P1_requirements:
    - "every REQ-* cites at least one LEG-*"
    - "BRD, TSD and FRD generated and cross-consistent"
  P2_basic_design:
    - "/mig_review_design reports zero Critical findings"
    - "SC / FC / API cross-checks pass"
  P3_detail_design:
    - "GAP report has zero unresolved items"
  P4_implementation:
    - "/mig_verify_build passes"
    - "/mig_review_commit reports zero Critical findings"
  P5_unit_test:
    - "every FC has at least one UT case"
    - "unit test suite green"
  P6_integration_test:
    - "every screen flow has at least one IT scenario"
  P7_uat:
    - "every UAT bug is closed, deferred with approval, or accepted"
  CR_change_request:
    - "the chosen option and its approver are recorded in the report"
    - "every impact-matrix row marked required is done or deferred with a reason"
    - "design documents were updated before code"
    - "traceability rows for CR-sourced behaviour cite the CR id"

# ---------------------------------------------------------------------------
# REVIEW - which checklist families apply. Turn off what you do not use.
# ---------------------------------------------------------------------------
review:
  families:
    common: true                 # C01..   document hygiene
    screen: true                 # SD01..
    function: true               # FD01..
    api: true                    # API01..
    data: true                   # DB01..
    batch: false                 # BT01..
    report: false                # RP01..
  severity_levels: ["Critical", "Warning", "Suggestion"]
  output_dir: "{{profile.paths.reviews}}"

# ---------------------------------------------------------------------------
# CONSTRAINTS - hard project rules enforced by hooks and skills.
# ---------------------------------------------------------------------------
constraints:
  db_schema_frozen: true         # no migrations; the schema pre-exists
  stored_procedures_readonly: true
  generated_files_glob: "**/*.generated.*"
  secrets_policy: "never commit secrets; .env.example documents the required keys"
  # Absolute-deny edit paths. Enforced by hooks/guard_readonly_paths.py.
  readonly_globs:
    - "src/legacy/**"
    - "**/*.generated.*"

# ---------------------------------------------------------------------------
# EXECUTION - which model the delegated agents run on.
# Applied to .claude/agents/*.md frontmatter by /mig_init.
# ---------------------------------------------------------------------------
execution:
  # Default for every mig_* agent. These roles all produce content whose failure
  # modes are silent - invented behaviour, missed anchors, a dropped category -
  # and none of them surface until client review. Cheap models fail there first.
  agent_model: opus
  # Per-agent overrides, only where a role is genuinely mechanical.
  agent_model_overrides: {}
  # Reasoning effort is a session-level setting in Claude Code, not agent
  # frontmatter. Record the intended level here so the team runs consistently.
  intended_effort: "extra high"

# ---------------------------------------------------------------------------
# TESTING - P5/P6/P7 artifacts, pipeline shape, automation and evidence.
# ---------------------------------------------------------------------------
testing:
  paths:
    testcase_root: "test/cases"        # one sub-folder per module
    step_subdir: "Step"                # intermediate checkpoint files
    it_plan: "test/it-plan"            # flow catalogue, strategy, swimlane
    automation_root: "test/automation"
    evidence_root: "test/evidence"
    results_root: "test/results"
  naming:
    module_dir: "UT_{BATCH}_{MODULE}"
    ut_file: "UT_{BATCH}_{MODULE}_{TS}.md"
    it_file: "IT_{FLOW}_{TS}.md"
    timestamp: "YYYYMMDD_HHmmss"
    batches: ["Pilot", "Batch1", "Batch2", "Batch3"]
  pipeline:
    # Points where the run stops for a human. Removing one removes the review
    # it existed to buy - see mig_test_ut.
    human_pauses: ["after_qna", "after_checklist"]
    keep_retry_history: true           # never delete a superseded checkpoint
    max_review_rounds: 3               # then escalate instead of looping
  viewpoints:                          # disable one only when it cannot apply
    - VP-01  # happy path
    - VP-02  # empty result
    - VP-03  # validation (field state, input, output, error)
    - VP-04  # auth failure
    - VP-05  # repeated submission
    - VP-06  # server / network error
    - VP-07  # cross-module navigation
    - VP-08  # permission
    - VP-09  # layout integrity
  integration:
    flow_catalogue: "test/it-plan/flow-definition.csv"
    strategy_guide: "test/it-plan/strategy-guide.csv"
    e2e_swimlane: "test/it-plan/e2e-swimlane.csv"
    api_payload_in_scope: false        # IT verifies flows, not request/response shape
  automation:
    framework: "<e.g. Playwright + TypeScript>"
    layout:
      specs: "tests/{module}"
      page_objects: "src/pages"
      data: "src/data"
      fixtures: "src/fixtures"
      db_client: "src/db"
    spec_naming: "{module}.flow{N}.spec.ts"
    db_driven_search: true             # never hardcode transactional search values
    results_format: "<e.g. allure>"
  evidence:
    naming: "{TC_ID}_{seq}"
    formats: ["png", "csv"]
  rounds:
    count: 2
    columns: ["date", "tester", "result", "note"]

# ---------------------------------------------------------------------------
# CHANGE REQUEST - client-initiated spec changes. Cross-cutting: a CR can arrive
# in any phase from P2 onward. Drives mig_change_request and the /mig_cr_* commands.
# ---------------------------------------------------------------------------
change_request:
  id_format: "CR-{NNN}"          # must match the client's CR list; "CR-{YYYY}-{NNN}" is common too
  id_source: client              # client | none. NEVER generated by the pack.
  min_options: 2                 # options phase 2 must present before the first gate
  # The two approval stops. Removing one removes the review it existed to buy:
  # after_options = which option, after_design = the document diff before any code.
  gates: ["after_options", "after_design"]
  # Document update order for phase 3. Keys from paths.bd_categories, then the tail
  # steps. A document edited before the one it consumes contradicts it.
  cascade:
    - data
    - screen
    - function
    - interface
    - detail
    - mockup
    - report
    - file
    - batch
    - indexes            # catalogue / "list of ..." documents
    - translations       # counterpart-language directories
    - test_cases
  update_test_cases: true        # false only where the project has no case documents
  classes: [CR-UI, CR-FIELD, CR-LOGIC, CR-MESSAGE, CR-REPORT, CR-DATA,
            CR-NEW, CR-REMOVE, CR-CLARIFY, CR-OUT-OF-SCOPE]

# ---------------------------------------------------------------------------
# BUG TRACE - cross-phase bug traceability (mig_bug_trace, /mig_trace_bug).
# Every key is optional: absent or empty means "detect from the repository".
# ---------------------------------------------------------------------------
bug_trace:
  mainline: ""                   # branch releases are cut from; "" = the branch origin/HEAD points to
  release_tag_pattern: ""        # glob for tags that are releases, e.g. "v*"; "" = every tag
  commit_ref_patterns: []        # extra regexes for ticket keys in commit messages, e.g. "WMS-[0-9]+"
